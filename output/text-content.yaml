cheat_sheet: "## Quick Reference: `create_assets/`\n\n### Literal Meaning\n\n| Element\
  \ | Meaning |\n|---|---|\n| `create_assets` | Snake_case name combining action `create`\
  \ + object `assets` |\n| `/` | Indicates a directory/folder path |\n| Full path\
  \ | Likely a folder for creating or generating assets |\n\n### What Is Known vs\
  \ Unknown\n\n| Known | Unknown |\n|---|---|\n| It is probably a directory | What\
  \ files it contains |\n| It relates to assets | What type of assets |\n| Name implies\
  \ creation/generation | Whether process is manual or automated |\n| Context is minimal\
  \ | Tools, commands, inputs, outputs |\n\n### Best-Practice Structure\n\n```text\n\
  create_assets/\n  README.md\n  config/\n  source/\n  templates/\n  scripts/\n  output/\n\
  \  cache/\n  tests/\n```\n\n### README Must Answer\n\n- What does this folder create?\n\
  - What inputs are required?\n- Where do outputs go?\n- What command runs the process?\n\
  - Which dependencies are needed?\n- Are outputs committed or ignored?\n- How are\
  \ assets validated?\n\n### Source vs Generated Assets\n\n| Type | Example | Commit?\
  \ |\n|---|---|---|\n| Source | `.svg`, `.fig`, raw image, prompt | Usually yes |\n\
  | Generated | thumbnails, optimized PNGs, sprite sheets | Depends |\n| Intermediate\
  \ | cache, temp resized files | Usually no |\n\n### Reproducibility Checklist\n\n\
  - Pin dependency versions.\n- Document commands.\n- Separate source from output.\n\
  - Avoid manual edits to generated files.\n- Add validation checks.\n- Define version-control\
  \ policy.\n\n### Example Commands\n\n```bash\npython create_assets/scripts/create_assets.py\n\
  python create_assets/scripts/validate_assets.py\n```\n\n### Main Rule\n\nA folder\
  \ name alone is not documentation. Turn `create_assets/` into a reliable workflow\
  \ by defining purpose, inputs, process, outputs, ownership, and validation."
takeaways:
- Add a README inside `create_assets/` explaining its purpose, required inputs, outputs,
  commands, and ownership.
- Separate source assets from generated outputs so contributors know which files to
  edit and which files to regenerate.
- Define an input/output contract that specifies accepted formats, naming rules, destination
  paths, and expected generated files.
- Create or document a single command that runs the asset-creation workflow from start
  to finish.
- Pin tool and dependency versions to make generated assets reproducible across machines.
- Decide which assets belong in version control and update `.gitignore` to exclude
  caches, temporary files, or reproducible outputs.
- Add validation checks for file names, dimensions, formats, file sizes, licensing,
  and completeness.
- Use the sparse directory name as a prompt to improve project architecture rather
  than assuming future users will infer its meaning.
learning_path:
