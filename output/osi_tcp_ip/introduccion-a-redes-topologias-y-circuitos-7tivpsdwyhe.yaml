summary: 'Hola vamos a narrar en este video la primer presentación de la Unidad 1
  de Redis y

  308 de altos de el pasicentero de la Bordeaux de Tenericía Niquitales de INE

  y lo que nos esté, porque estamos viendo ahí es el estudio de cada una de los objetivos
  en

  los que queremos el sumergir para el estudio de la Bordeaux de Tenericía Niquitales
  de Tenericía

  El modelo de los objetivos ya fue de alguna manera estudiado del año pasado y se
  comparo con el

  modelo TCP. La idea es que este modelo de los objetivos tiene diferentes niveles
  y en cada nivel

  reciuelve una parte de lo que se refiere a la comunicación de datos a través de
  Redis. El nivel físico se encarga entonces de la conexión física del hardware y
  de su manera de

  tranquil esas inclusos eléctricos o de microondas que viajan a través de la aire
  o a través de cable. La capa de enlace es la que se apropia de ese aprende de datos
  y lo prepara para que sea

  interpretado por la capa de Red. Esa es la capa que se encargar de dirección a los
  datos para

  que sean redirigidos hacia otros destinos o si el destinatario es ese equipo lo
  traslada a

  las capas superiores.'
