  - 'Microsoft Learn: Herramientas de línea de comandos de red de Windows - https://learn.microsoft.com/windows-server/administration/windows-commands/'
  - Wireshark User Guide - https://www.wireshark.org/docs/wsug_html_chunked/
  - Packet Tracer de Cisco para simulación de redes - https://www.netacad.com/courses/packet-tracer
  - GNS3 para laboratorios de redes avanzados - https://www.gns3.com/
  - Documentación de Microsoft sobre `ipconfig` - https://learn.microsoft.com/windows-server/administration/windows-commands/ipconfig
  - Documentación de Microsoft sobre `ping` - https://learn.microsoft.com/windows-server/administration/windows-commands/ping
  - Documentación de Microsoft sobre `tracert` - https://learn.microsoft.com/windows-server/administration/windows-commands/tracert
  - Documentación de Microsoft sobre `netstat` - https://learn.microsoft.com/windows-server/administration/windows-commands/netstat
  - Documentación de Microsoft sobre `nslookup` - https://learn.microsoft.com/windows-server/administration/windows-commands/nslookup
quiz_questions:
- question: ¿Qué comando usarías primero para ver la IP actual de un equipo, la máscara
    de red, el gateway y si la configuración fue obtenida automáticamente por DHCP?
  answer: B. ipconfig
  explanation: 'El comando ipconfig muestra el estado básico de las conexiones de
    red del equipo: dirección IP, máscara, puerta de enlace o gateway y datos relacionados
    con DHCP. ping sirve para probar conectividad, arp muestra asociaciones entre
    direcciones IP y físicas, y netstat informa conexiones o puertos abiertos, pero
    ninguno de ellos da directamente la configuración IP principal del adaptador como
    ipconfig.'
  difficulty: easy
  type: multiple_choice
  options:
  - A. ping
  - B. ipconfig
  - C. arp
  - D. netstat
- question: Netstat y arp entregan información equivalente porque ambos muestran principalmente
    los puertos abiertos de la capa de transporte.
  answer: 'False'
  explanation: Netstat se asocia con la visualización de conexiones activas y puertos
    abiertos en la capa de transporte, por ejemplo TCP o UDP. En cambio, arp permite
    observar asociaciones entre direcciones lógicas IP y direcciones físicas MAC,
    es decir, información relacionada con la comunicación local en capa 2. Por eso
    no entregan información equivalente, aunque ambos sean útiles para diagnosticar
    redes.
  difficulty: medium
  type: true_false
- question: Estás instalando una PC nueva en una oficina. Una computadora vecina funciona
    correctamente en la red y tiene acceso a internet. La nueva PC no recibe configuración
    automática por DHCP, pero necesitas asignarle una IP estática que le permita comunicarse
    con el resto de la LAN. ¿Cuál sería el mejor procedimiento inicial?
  answer: B. Ejecutar ipconfig /all en la computadora vecina, identificar su IP, máscara,
    gateway y DNS, y configurar en la nueva PC una IP libre del mismo rango sin duplicarla.
  explanation: Si una máquina vecina funciona, su configuración permite inferir el
    rango de red, la máscara, el gateway y posiblemente los DNS. La nueva PC debe
    usar una dirección IP del mismo segmento, pero no la misma IP, porque duplicarla
    causaría conflictos. netstat no sirve para definir parámetros IP, ping no configura
    la red por sí mismo y copiar la IP o la MAC de otra máquina sería incorrecto y
    problemático.
  difficulty: hard
  type: scenario
  options:
  - A. Ejecutar netstat en la PC nueva y copiar uno de los puertos abiertos como dirección
    IP.
  - B. Ejecutar ipconfig /all en la computadora vecina, identificar su IP, máscara,
    gateway y DNS, y configurar en la nueva PC una IP libre del mismo rango sin duplicarla.
  - C. Ejecutar ping -t a cualquier sitio de internet y esperar hasta que la PC nueva
    obtenga una dirección IP automáticamente.
  - D. Ejecutar arp en la computadora vecina y copiar exactamente la misma dirección
    IP y MAC en la PC nueva.
- question: Compara el uso de ping -t con tracert cuando se diagnostica un problema
    de conectividad. ¿En qué situación usarías cada uno?
  answer: Usaría ping -t cuando quiero comprobar de forma continua si un destino responde,
    especialmente ante fallas intermitentes o mientras se repara una conexión. Usaría
    tracert cuando necesito saber por qué ruta viaja el paquete y en qué salto podría
    estar el problema antes de llegar al destino. Ping confirma continuidad o pérdida
    de respuesta; tracert agrega información sobre el camino y los equipos intermedios.
  explanation: Aunque ambos comandos ayudan a diagnosticar conectividad, responden
    preguntas distintas. ping -t mantiene el envío de mensajes para observar caídas,
    demoras o recuperación de la comunicación en tiempo real. tracert, en cambio,
    muestra los saltos o routers intermedios, lo que resulta más útil en redes grandes
    donde el problema puede estar en algún punto de la ruta y no necesariamente en
    el destino final.
  difficulty: medium
  type: comparison
flashcards:
- front: ¿Para qué sirve agregar el símbolo de interrogación (?) al final de un comando
    de red?
  back: Sirve para mostrar la ayuda del comando, incluyendo opciones y modificadores
    disponibles.
  tags:
  - redes
  - comandos
  - ayuda
- front: ¿Qué información básica muestra el comando ipconfig?
  back: Muestra el estado de las conexiones de red, incluyendo dirección IP, máscara
    de subred, gateway y, si corresponde, servidores DNS.
  tags:
  - redes
  - ipconfig
  - configuracion
- front: ¿Por qué es útil usar ipconfig /all al instalar una máquina nueva en una
    red?
  back: Porque muestra información detallada de la configuración de red, lo que permite
    tomar como referencia datos como IP, máscara y gateway para configurar correctamente
    el nuevo equipo.
  tags:
  - redes
  - ipconfig
  - diagnostico
- front: ¿Cómo se usa ping para comprobar continuamente si un equipo remoto vuelve
    a responder?
  back: Se usa ping -t seguido de la dirección destino; el comando seguirá enviando
    mensajes hasta que se interrumpa manualmente.
  tags:
  - redes
  - ping
  - diagnostico
- front: ¿Cuál es la diferencia entre ping y tracert?
  back: ping verifica si hay conectividad con un destino, mientras que tracert muestra
    la ruta y los saltos que sigue el paquete hasta llegar a ese destino.
  tags:
  - redes
  - ping
  - tracert
practice_exercises:
- title: Diagnóstico guiado de conectividad en una estación Windows
  description: 'Contexto: eres técnico de soporte y recibes una PC con Windows que
    aparentemente tiene problemas de red. Debes determinar si el problema está en
    la configuración IP local, la comunicación con la red local, la salida a Internet
    o la resolución DNS. Tarea: ejecuta y documenta una secuencia de diagnóstico usando
    los comandos ipconfig, ipconfig /all, ping, arp, netstat, tracert y nslookup.
    Puedes hacerlo en una PC real, una máquina virtual o un simulador. Entregables:
    1) una tabla con cada comando ejecutado, el objetivo de la prueba y el resultado
    observado; 2) capturas o copias del texto de salida más relevante; 3) una conclusión
    indicando si la conectividad local, la puerta de enlace, Internet y DNS funcionan
    correctamente; 4) una recomendación de acción si detectas un problema. Debes incluir
    como mínimo estas pruebas: verificar IP, máscara, gateway y DNS con ipconfig /all;
    hacer ping a 127.0.0.1, a la IP local, al gateway, a una IP pública como 8.8.8.8
    y a un dominio como google.com; revisar la tabla ARP; observar conexiones activas
    con netstat; trazar la ruta hacia un dominio con tracert; y resolver un dominio
    con nslookup.'
  difficulty: medium
  type: analysis
  hints:
  - 'Hint 1: Sigue un orden de diagnóstico: primero la configuración local, luego
    la red local, después Internet y finalmente DNS.'
  - 'Hint 2: Si ping a 8.8.8.8 funciona pero ping a google.com falla, probablemente
    el problema esté relacionado con DNS.'
  - 'Hint 3: Compara la IP y la máscara de tu equipo con la puerta de enlace; normalmente
    deben pertenecer a la misma red.'
  solution: 'Una buena solución debe mostrar una secuencia lógica de diagnóstico.
    Puntos clave esperados: ipconfig /all identifica IP, máscara, gateway, servidores
    DNS, si la dirección fue asignada por DHCP y el estado del adaptador. ping 127.0.0.1
    valida la pila TCP/IP local. ping a la IP propia valida la interfaz local. ping
    al gateway valida conectividad dentro de la LAN. ping a 8.8.8.8 valida salida
    a Internet sin depender de DNS. ping a un dominio valida conectividad más resolución
    de nombres. arp -a muestra direcciones IP con las que el equipo se comunicó y
    sus MAC asociadas, útil para comprobar comunicación de capa 2 con el gateway u
    otros hosts. netstat permite observar conexiones activas y puertos en uso. tracert
    muestra los saltos hasta el destino y ayuda a ubicar dónde se corta la ruta. nslookup
    confirma si el DNS resuelve nombres correctamente. Conclusiones posibles: si falla
    desde ping al gateway, revisar IP, máscara, cable/Wi-Fi, VLAN o gateway; si el
    gateway responde pero no 8.8.8.8, revisar salida a Internet o router; si 8.8.8.8
    responde pero falla google.com/nslookup, revisar configuración DNS; si todo responde
    correctamente, la conectividad básica funciona y el problema podría estar en una
    aplicación, firewall o servicio específico.'
