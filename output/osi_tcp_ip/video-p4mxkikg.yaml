title: Video p4mXkikG
source_type: video
source_ref: https://www.youtube.com/watch?v=p4mXkikGxlk
summary: 'El contenido presenta una introducción práctica a los comandos de red más
  comunes para diagnosticar, verificar y comprender el estado de una conexión en sistemas
  tipo Windows. La tesis central es que, antes de modificar o instalar equipos en
  una red, conviene observar la configuración local, comprobar la conectividad, identificar
  rutas, revisar puertos y validar la resolución DNS mediante herramientas de línea
  de comandos. La metodología propuesta es exploratoria y diagnóstica: ejecutar comandos,
  consultar su ayuda con el signo de interrogación o modificadores disponibles, observar
  los resultados y practicar su interpretación en entornos reales o simuladores.


  El recorrido comienza con ipconfig, que permite conocer la configuración IP del
  equipo: dirección IP, máscara de subred, puerta de enlace, configuración DHCP y
  servidores DNS. Su variante ipconfig /all ofrece información más profunda, útil
  para ubicar un equipo dentro de una red y replicar parámetros válidos al instalar
  una máquina nueva o configurar una IP estática. Luego se aborda netstat, orientado
  a observar conexiones y puertos abiertos en la capa de transporte, lo que ayuda
  a comprobar si existen comunicaciones activas con otros equipos o servicios externos.


  El comando arp permite ver la relación entre direcciones IP y direcciones físicas
  MAC con las que el equipo se ha comunicado, aportando una visión de capa 2. Ping
  se presenta como una herramienta esencial para verificar conectividad mediante mensajes
  ICMP; sus modificadores permiten realizar pruebas continuas, aumentar el tamaño
  del paquete o ajustar el tiempo de espera. Tracert amplía esta verificación mostrando
  la ruta y los saltos intermedios hasta un destino. Finalmente, nslookup permite
  comprobar si el DNS resuelve correctamente nombres de dominio a direcciones IP.


  La conclusión es que estos comandos forman una caja básica de diagnóstico de red.
  Su valor no está solo en ejecutarlos, sino en interpretar sus resultados para localizar
  fallas, validar configuraciones y comprender el comportamiento de una red.'
detailed_notes: "## 1. Propósito general de los comandos de red\n\nLos comandos presentados\
  \ sirven para **diagnosticar, verificar y comprender el estado de una red** desde\
  \ un equipo cliente. Permiten responder preguntas como:\n\n- ¿Qué dirección IP tiene\
  \ mi equipo?\n- ¿La IP fue asignada automáticamente por DHCP o configurada manualmente?\n\
  - ¿Cuál es la puerta de enlace predeterminada?\n- ¿Qué máscara de subred se está\
  \ usando?\n- ¿Existe conectividad con otro equipo?\n- ¿Qué puertos o conexiones\
  \ están activos?\n- ¿Qué dirección MAC corresponde a una IP conocida?\n- ¿Por qué\
  \ ruta viajan los paquetes hasta un destino?\n- ¿El servidor DNS resuelve nombres\
  \ correctamente?\n\nUna idea clave del contenido es que **los comandos no solo se\
  \ ejecutan: se interpretan**. El aprendizaje real ocurre al observar resultados,\
  \ compararlos con lo esperado y deducir el estado de la red.\n\n## 2. Ayuda y modificadores\
  \ de comandos\n\nMuchos comandos de red admiten **modificadores**, también llamados\
  \ opciones o parámetros. Estos amplían su comportamiento.\n\n### Cómo pedir ayuda\n\
  \nEn Windows, normalmente se puede consultar la ayuda de un comando con:\n\n```text\n\
  comando /?\n```\n\nEjemplos:\n\n```text\nipconfig /?\nping /?\nnetstat /?\narp /?\n\
  tracert /?\nnslookup /?\n```\n\nLa ayuda muestra:\n\n- Sintaxis del comando.\n-\
  \ Modificadores disponibles.\n- Ejemplos de uso.\n- Explicación de los campos de\
  \ salida.\n\n## 3. ipconfig: ver la configuración IP local\n\n### Función principal\n\
  \n`ipconfig` muestra el estado de las interfaces de red del equipo. Permite saber\
  \ cómo está configurado el host dentro de la red.\n\nComando básico:\n\n```text\n\
  ipconfig\n```\n\n### Información que entrega\n\nEntre los datos más importantes\
  \ se encuentran:\n\n- **Dirección IPv4**: IP asignada al equipo.\n- **Máscara de\
  \ subred**: define el tamaño de la red local.\n- **Puerta de enlace predeterminada**:\
  \ router o gateway usado para salir a otras redes.\n- **Adaptador de red**: interfaz\
  \ física o virtual usada para conectarse.\n\nEjemplo conceptual:\n\n```text\nDirección\
  \ IPv4 . . . . . . . . . . : 192.168.1.25\nMáscara de subred . . . . . . . . : 255.255.255.0\n\
  Puerta de enlace predeterminada . : 192.168.1.1\n```\n\n### Interpretación\n\nCon\
  \ esos datos se puede deducir:\n\n- El equipo pertenece a la red `192.168.1.0/24`.\n\
  - Puede comunicarse directamente con hosts como `192.168.1.10` o `192.168.1.50`.\n\
  - Para salir hacia Internet u otras redes usará el gateway `192.168.1.1`.\n\n###\
  \ Uso para instalar una máquina nueva\n\nEl contenido menciona una práctica común:\
  \ si se instala un equipo nuevo, puede observarse la configuración de una máquina\
  \ vecina para inferir los parámetros de red.\n\nPor ejemplo, si una PC vecina tiene:\n\
  \n```text\nIP: 192.168.1.20\nMáscara: 255.255.255.0\nGateway: 192.168.1.1\nDNS:\
  \ 8.8.8.8\n```\n\nEntonces una nueva máquina podría configurarse con una IP libre\
  \ del mismo rango, por ejemplo:\n\n```text\nIP: 192.168.1.30\nMáscara: 255.255.255.0\n\
  Gateway: 192.168.1.1\nDNS: 8.8.8.8\n```\n\nAdvertencia importante: antes de asignar\
  \ una IP estática hay que verificar que no esté en uso para evitar conflictos.\n\
  \n## 4. ipconfig /all: información detallada de red\n\nComando:\n\n```text\nipconfig\
  \ /all\n```\n\n### Qué agrega respecto de ipconfig\n\n`ipconfig /all` muestra información\
  \ más completa, como:\n\n- Dirección física o **MAC address**.\n- Estado de DHCP.\n\
  - Servidor DHCP usado.\n- Servidores DNS configurados.\n- Sufijo DNS.\n- Fecha de\
  \ concesión DHCP.\n- Fecha de expiración de la concesión DHCP.\n\n### DHCP\n\nSi\
  \ el equipo obtiene su IP automáticamente, aparecerá información relacionada con\
  \ **DHCP**. DHCP asigna automáticamente parámetros como:\n\n- Dirección IP.\n- Máscara\
  \ de subred.\n- Gateway.\n- DNS.\n\nEsto permite determinar si el equipo está configurado\
  \ manualmente o si depende de un servidor DHCP.\n\n### DNS\n\nSi hay servidores\
  \ DNS configurados, también aparecen en la salida de `ipconfig /all`. Esto es importante\
  \ porque un equipo puede tener conectividad IP pero no resolver nombres de dominio.\n\
  \nEjemplo de problema:\n\n- `ping 8.8.8.8` funciona.\n- `ping google.com` no funciona.\n\
  \nInterpretación probable: hay conectividad IP, pero falla la resolución DNS.\n\n\
  ## 5. netstat: conexiones y puertos activos\n\n### Función principal\n\n`netstat`\
  \ permite observar conexiones de red activas y puertos abiertos en la **capa de\
  \ transporte**, principalmente TCP y UDP.\n\nComando básico:\n\n```text\nnetstat\n\
  ```\n\nComando frecuente:\n\n```text\nnetstat -an\n```\n\n### Qué permite observar\n\
  \n- Conexiones locales y remotas.\n- Puertos abiertos o en escucha.\n- Estados de\
  \ conexiones TCP.\n- Servicios que podrían estar comunicándose con el exterior.\n\
  \n### Conceptos clave\n\nUna conexión de red suele identificarse por:\n\n```text\n\
  IP local : puerto local  ->  IP remota : puerto remoto\n```\n\nEjemplo conceptual:\n\
  \n```text\nTCP 192.168.1.25:51532 142.250.78.14:443 ESTABLISHED\n```\n\nInterpretación:\n\
  \n- El equipo local `192.168.1.25` está conectado desde el puerto local `51532`.\n\
  - El destino remoto es `142.250.78.14`.\n- El puerto remoto `443` corresponde normalmente\
  \ a HTTPS.\n- El estado `ESTABLISHED` indica conexión activa.\n\n### Estados comunes\
  \ en TCP\n\n- **LISTENING**: un servicio está esperando conexiones entrantes.\n\
  - **ESTABLISHED**: conexión activa entre dos equipos.\n- **TIME_WAIT**: conexión\
  \ cerrada recientemente, esperando limpieza.\n- **CLOSE_WAIT**: el extremo remoto\
  \ cerró la conexión y el local aún no terminó.\n\n### Utilidad diagnóstica\n\n`netstat`\
  \ ayuda a responder:\n\n- ¿Hay servicios escuchando en el equipo?\n- ¿Existe comunicación\
  \ activa con otro host?\n- ¿Qué puertos están siendo usados?\n- ¿Se detectan conexiones\
  \ inesperadas?\n\n## 6. arp: relación entre direcciones IP y direcciones físicas\n\
  \n### Función principal\n\n`arp` muestra la tabla ARP del equipo. Esta tabla relaciona\
  \ direcciones IP con direcciones físicas MAC.\n\nComando habitual:\n\n```text\n\
  arp -a\n```\n\n### Capa de red relacionada\n\nARP trabaja entre:\n\n- **Capa 2**:\
  \ direcciones MAC.\n- **Capa 3**: direcciones IP.\n\nPermite que un host sepa a\
  \ qué dirección MAC debe enviar una trama Ethernet cuando quiere comunicarse con\
  \ una IP dentro de la misma red local.\n\n### Ejemplo conceptual\n\n```text\nInterfaz:\
  \ 192.168.1.25 --- 0x6\n  Dirección de Internet      Dirección física        Tipo\n\
  \  192.168.1.1                aa-bb-cc-dd-ee-ff       dinámico\n  192.168.1.20 \
  \              11-22-33-44-55-66       dinámico\n```\n\nInterpretación:\n\n- El\
  \ equipo conoce la MAC asociada a `192.168.1.1`, probablemente el gateway.\n- También\
  \ conoce la MAC de `192.168.1.20`, un host con el que se comunicó.\n\n### Qué revela\
  \ la tabla ARP\n\nLa tabla ARP permite ver:\n\n- Con qué equipos de la red local\
  \ se comunicó el host.\n- Qué IP corresponde a qué MAC.\n- Si hay entradas dinámicas\
  \ aprendidas automáticamente.\n- Si existen entradas estáticas configuradas manualmente.\n\
  \n### Direcciones broadcast\n\nEl contenido menciona direcciones lógicas como broadcast.\
  \ En redes IPv4, una dirección de broadcast permite enviar un paquete a todos los\
  \ hosts de una subred.\n\nEjemplo para red `192.168.1.0/24`:\n\n```text\nDirección\
  \ de red:      192.168.1.0\nHosts válidos:         192.168.1.1 - 192.168.1.254\n\
  Broadcast:             192.168.1.255\nMáscara:               255.255.255.0\n```\n\
  \n## 7. ping: prueba básica de conectividad\n\n### Función principal\n\n`ping` permite\
  \ comprobar si un equipo responde en la red mediante mensajes ICMP.\n\nComando básico:\n\
  \n```text\nping destino\n```\n\nEjemplos:\n\n```text\nping 192.168.1.1\nping 8.8.8.8\n\
  ping google.com\n```\n\n### Qué mide ping\n\nNormalmente muestra:\n\n- Si hubo respuesta\
  \ del destino.\n- Tiempo de ida y vuelta en milisegundos.\n- Cantidad de paquetes\
  \ enviados y recibidos.\n- Porcentaje de pérdida.\n- TTL del paquete recibido.\n\
  \nEjemplo conceptual:\n\n```text\nRespuesta desde 8.8.8.8: bytes=32 tiempo=18ms\
  \ TTL=118\nPaquetes: enviados = 4, recibidos = 4, perdidos = 0 (0% perdidos)\n```\n\
  \n### Interpretación básica\n\n- **0% de pérdida**: conectividad estable durante\
  \ la prueba.\n- **Pérdida parcial**: posible congestión, interferencia, mala conexión\
  \ o filtrado.\n- **100% de pérdida**: no hay respuesta; puede ser falla de red,\
  \ firewall o destino apagado.\n- **Tiempo alto**: latencia elevada.\n\n### Modificador\
  \ -t: ping continuo\n\nComando:\n\n```text\nping -t destino\n```\n\nUso:\n\n- Envía\
  \ paquetes continuamente hasta detenerlo manualmente.\n- En Windows se detiene con\
  \ `Ctrl + C`.\n\nAplicaciones:\n\n- Verificar cuándo vuelve una conexión después\
  \ de repararla.\n- Detectar cortes intermitentes.\n- Observar pérdida de paquetes\
  \ en el tiempo.\n\nEjemplo:\n\n```text\nping -t 192.168.1.1\n```\n\nSi el gateway\
  \ no responde y luego se repara el enlace, se verá el cambio de mensajes fallidos\
  \ a respuestas exitosas.\n\n### Modificador -w: tiempo de espera\n\nComando:\n\n\
  ```text\nping -w tiempo_en_ms destino\n```\n\nEjemplo:\n\n```text\nping -w 3000\
  \ 192.168.1.1\n```\n\nAumenta el tiempo de espera antes de considerar que no hubo\
  \ respuesta. Es útil en conexiones lentas, saturadas o inestables.\n\n### Modificador\
  \ -l: tamaño del paquete\n\nComando:\n\n```text\nping -l tamaño_en_bytes destino\n\
  ```\n\nEjemplo:\n\n```text\nping -l 1000 192.168.1.1\n```\n\nPermite enviar paquetes\
  \ más grandes para probar comportamiento bajo mayor carga o detectar problemas relacionados\
  \ con MTU.\n\n### Secuencia recomendada de pruebas con ping\n\nPara diagnosticar\
  \ conectividad, conviene probar en este orden:\n\n1. `ping 127.0.0.1` para comprobar\
  \ la pila TCP/IP local.\n2. `ping IP_local` para comprobar la interfaz del equipo.\n\
  3. `ping gateway` para comprobar salida a la red local.\n4. `ping IP_externa` para\
  \ comprobar salida a Internet sin depender de DNS.\n5. `ping dominio` para comprobar\
  \ conectividad más resolución DNS.\n\n## 8. tracert: ruta y saltos hasta un destino\n\
  \n### Función principal\n\n`tracert` muestra por dónde pasa un paquete antes de\
  \ llegar a su destino. Permite ver la ruta en términos de saltos intermedios.\n\n\
  Comando:\n\n```text\ntracert destino\n```\n\nEjemplos:\n\n```text\ntracert 8.8.8.8\n\
  tracert google.com\n```\n\n### Qué es un salto\n\nUn **salto** es un router o equipo\
  \ intermedio por el que pasa el tráfico. En redes grandes, el paquete puede atravesar\
  \ varios routers antes de llegar al destino.\n\n### Ejemplo conceptual\n\n```text\n\
  \  1     1 ms     1 ms     1 ms  192.168.1.1\n  2    10 ms    12 ms    11 ms  10.20.0.1\n\
  \  3    18 ms    17 ms    19 ms  200.45.10.1\n  4    25 ms    24 ms    26 ms  8.8.8.8\n\
  ```\n\nInterpretación:\n\n- El primer salto suele ser el gateway local.\n- Los saltos\
  \ siguientes son routers intermedios.\n- Si la ruta se corta en un salto, el problema\
  \ puede estar a partir de ese punto.\n\n### Relación con ping\n\n- `ping` responde\
  \ si hay conectividad con el destino.\n- `tracert` muestra el camino que sigue el\
  \ tráfico.\n\nPor eso, si `ping` falla, `tracert` ayuda a ubicar dónde podría estar\
  \ el corte.\n\n## 9. nslookup: resolución DNS\n\n### Función principal\n\n`nslookup`\
  \ consulta servidores DNS para resolver nombres de dominio a direcciones IP.\n\n\
  Comando básico:\n\n```text\nnslookup dominio\n```\n\nEjemplo:\n\n```text\nnslookup\
  \ google.com\n```\n\n### Qué permite verificar\n\n- Si el equipo tiene configurado\
  \ un servidor DNS.\n- Si ese DNS responde.\n- Qué IP corresponde a un nombre de\
  \ dominio.\n- Si un problema de navegación se debe a DNS o a conectividad.\n\n###\
  \ Ejemplo conceptual\n\n```text\nServidor:  dns.local\nAddress:   192.168.1.1\n\n\
  Nombre:    google.com\nAddresses: 142.250.78.14\n```\n\nInterpretación:\n\n- El\
  \ servidor DNS usado es `192.168.1.1`.\n- El dominio `google.com` fue resuelto a\
  \ una IP.\n\n### Diagnóstico típico\n\nCaso 1:\n\n```text\nping 8.8.8.8 funciona\n\
  nslookup google.com falla\n```\n\nInterpretación: la conexión IP existe, pero hay\
  \ problema DNS.\n\nCaso 2:\n\n```text\nping 8.8.8.8 falla\nnslookup google.com falla\n\
  ```\n\nInterpretación: puede haber un problema de conectividad general, gateway,\
  \ enlace o firewall.\n\n## 10. Relación de comandos con capas de red\n\n| Comando\
  \ | Capa principal | Qué diagnostica |\n|---|---:|---|\n| `ipconfig` | Capa 3 |\
  \ Configuración IP local |\n| `ipconfig /all` | Capas 2/3 | IP, MAC, DHCP, DNS |\n\
  | `arp -a` | Capas 2/3 | Relación IP-MAC en red local |\n| `ping` | Capa 3 | Conectividad\
  \ mediante ICMP |\n| `tracert` | Capa 3 | Ruta y saltos hasta destino |\n| `netstat`\
  \ | Capa 4 | Puertos y conexiones TCP/UDP |\n| `nslookup` | Capa 7 | Resolución\
  \ de nombres DNS |\n\n## 11. Flujo práctico de diagnóstico de red\n\nUn procedimiento\
  \ ordenado podría ser:\n\n### Paso 1: Ver configuración local\n\n```text\nipconfig\
  \ /all\n```\n\nComprobar:\n\n- IP válida.\n- Máscara correcta.\n- Gateway configurado.\n\
  - DNS configurado.\n- DHCP activo o IP estática esperada.\n\n### Paso 2: Probar\
  \ pila local\n\n```text\nping 127.0.0.1\n```\n\nSi falla, el problema está en la\
  \ configuración TCP/IP local.\n\n### Paso 3: Probar gateway\n\n```text\nping IP_del_gateway\n\
  ```\n\nSi falla, revisar:\n\n- Cableado o Wi-Fi.\n- VLAN o switch.\n- Máscara incorrecta.\n\
  - IP duplicada.\n- Gateway apagado o filtrando ICMP.\n\n### Paso 4: Ver vecinos\
  \ conocidos\n\n```text\narp -a\n```\n\nComprobar si aparece la MAC del gateway u\
  \ otros hosts.\n\n### Paso 5: Probar salida externa\n\n```text\nping 8.8.8.8\n```\n\
  \nSi funciona, hay salida IP hacia Internet.\n\n### Paso 6: Probar DNS\n\n```text\n\
  nslookup google.com\n```\n\nSi falla, revisar configuración DNS.\n\n### Paso 7:\
  \ Ver ruta\n\n```text\ntracert 8.8.8.8\n```\n\nAyuda a localizar en qué salto se\
  \ interrumpe la comunicación.\n\n### Paso 8: Revisar conexiones y puertos\n\n```text\n\
  netstat -an\n```\n\nPermite detectar conexiones activas, servicios en escucha o\
  \ tráfico inesperado.\n\n## 12. Conclusión operativa\n\nEstos comandos forman una\
  \ caja básica de herramientas para administración y diagnóstico de red. La clave\
  \ está en practicar en distintos escenarios y aprender a interpretar patrones:\n\
  \n- Configuración correcta pero sin conectividad.\n- Conectividad local sin Internet.\n\
  - Internet por IP pero sin DNS.\n- Pérdida intermitente de paquetes.\n- Puertos\
  \ abiertos inesperados.\n- Rutas incompletas o saltos que no responden.\n\nDominar\
  \ estos comandos permite resolver problemas de red con método, en lugar de hacerlo\
  \ por prueba y error."
key_concepts:
- 'Configuración IP: conjunto de parámetros de red de un host, incluyendo dirección
  IP, máscara, gateway y DNS.'
- 'Dirección IP: identificador lógico que permite ubicar un equipo dentro de una red
  IPv4 o IPv6.'
- 'Máscara de subred: valor que determina qué parte de una dirección IP corresponde
  a la red y qué parte al host.'
- 'Puerta de enlace predeterminada: router usado por un equipo para enviar tráfico
  hacia redes externas.'
- 'DHCP: servicio que asigna automáticamente parámetros de red a los equipos de una
  red.'
- 'DNS: sistema que traduce nombres de dominio legibles por humanos en direcciones
  IP utilizables por los equipos.'
- 'Dirección MAC: identificador físico de una interfaz de red usado en comunicaciones
  de capa 2.'
- 'Tabla ARP: registro local que asocia direcciones IP con direcciones MAC dentro
  de la red local.'
- 'Puerto de red: número lógico usado por TCP o UDP para identificar aplicaciones
  o servicios en un host.'
- 'Conectividad: capacidad de un equipo para comunicarse correctamente con otro destino
  de red.'
- 'ICMP: protocolo usado por herramientas como ping para enviar mensajes de prueba
  y diagnóstico.'
- 'Latencia: tiempo que tarda un paquete en ir hasta un destino y volver al origen.'
- 'Pérdida de paquetes: porcentaje de mensajes enviados que no reciben respuesta,
  indicador de fallas o inestabilidad.'
- 'Salto de red: router o dispositivo intermedio atravesado por un paquete hasta llegar
  a su destino.'
- 'Resolución de nombres: proceso por el cual un dominio como example.com se convierte
  en una dirección IP.'
glossary:
- term: ipconfig
  definition: Comando de Windows que muestra la configuración IP de los adaptadores
    de red del equipo, incluyendo dirección IP, máscara y gateway.
  related_terms:
  - IP
  - máscara de subred
  - gateway
  - DHCP
- term: ipconfig /all
  definition: Variante detallada de ipconfig que muestra información extendida como
    dirección MAC, servidores DNS, estado DHCP y concesiones de red.
  related_terms:
  - ipconfig
  - MAC
  - DNS
  - DHCP
- term: Dirección IP
  definition: Dirección lógica asignada a un dispositivo para identificarlo y permitir
    su comunicación en una red.
  related_terms:
  - IPv4
  - subred
  - gateway
- term: IPv4
  definition: Versión del protocolo IP que usa direcciones de 32 bits, comúnmente
    escritas como cuatro números decimales separados por puntos.
  related_terms:
  - dirección IP
  - máscara de subred
  - broadcast
- term: Máscara de subred
  definition: Parámetro que indica qué porción de una dirección IP pertenece a la
    red y qué porción identifica al host.
  related_terms:
  - subred
  - CIDR
  - broadcast
- term: Gateway
  definition: Dispositivo, normalmente un router, que permite a un host comunicarse
    con redes diferentes a la red local.
  related_terms:
  - router
  - ipconfig
  - tracert
- term: DHCP
  definition: Protocolo que asigna automáticamente direcciones IP y otros parámetros
    de red a los dispositivos clientes.
  related_terms:
  - ipconfig /all
  - concesión DHCP
  - IP dinámica
- term: DNS
  definition: Sistema de nombres de dominio que traduce nombres como google.com en
    direcciones IP.
  related_terms:
  - nslookup
  - dominio
  - resolución de nombres
- term: netstat
  definition: Comando que muestra conexiones de red, puertos abiertos y estados de
    comunicación TCP/UDP.
  related_terms:
  - TCP
  - UDP
  - puerto
  - socket
- term: Puerto
  definition: Número lógico usado por TCP o UDP para dirigir tráfico hacia una aplicación
    o servicio específico.
  related_terms:
  - TCP
