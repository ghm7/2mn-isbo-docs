quiz_questions:
- question: La dirección que los dispositivos de capa 2 utilizan para identificar
    de forma única a cada equipo en la red es la dirección _____.
  answer: MAC
  explanation: La dirección MAC es el identificador de control de acceso al medio
    asociado a la interfaz de red de un dispositivo. En la unidad se destaca que los
    dispositivos de capa 2, como bridges y switches, trabajan con direcciones MAC,
    no con direcciones IP, y que estas son únicas e irrepetibles a nivel mundial.
  difficulty: easy
  type: fill_blank
- question: Un switch recibe una trama destinada a una dirección MAC que todavía no
    aparece en su tabla. ¿Cuál es el comportamiento correcto del switch según lo explicado?
  answer: C. La reenvía por todas sus bocas excepto la de entrada y aprende la MAC
    de origen.
  explanation: El switch aprende a partir de las tramas entrantes qué dirección MAC
    está asociada a cada puerto. Si todavía no conoce la MAC de destino, no puede
    reenviar la trama de forma selectiva, por lo que la difunde por sus otros puertos.
    Cuando recibe respuestas, va completando su tabla MAC y luego puede enviar el
    tráfico solo por la boca correspondiente.
  difficulty: medium
  type: multiple_choice
  options:
  - A. Descarta la trama porque no puede identificar el destino.
  - B. La envía únicamente al puerto por el que llegó para confirmar el origen.
  - C. La reenvía por todas sus bocas excepto la de entrada y aprende la MAC de origen.
  - D. La convierte en una trama de capa 3 para buscar la dirección IP del destino.
- question: 'En Packet Tracer tienes una topología en cascada: PC-A está conectado
    al puerto Fa0/1 del switch S1, PC-C al Fa0/2 de S1, y el puerto Fa0/24 de S1 conecta
    con S2. En S2, PC-B está conectado al Fa0/1. Las tablas MAC de ambos switches
    están vacías. PC-A envía una trama a PC-B. ¿Qué ocurrirá primero y qué pasará
    después de la respuesta de PC-B?'
  answer: B. S1 aprenderá la MAC de PC-A en Fa0/1 y difundirá la trama por Fa0/2 y
    Fa0/24; S2 aprenderá la MAC de PC-A por su enlace hacia S1 y difundirá hacia PC-B.
    La respuesta de PC-B permitirá que ambos switches aprendan dónde está PC-B.
  explanation: 'Cuando un switch no conoce la MAC de destino, realiza flooding: reenvía
    la trama por todos los puertos excepto el puerto de entrada. Al mismo tiempo,
    aprende la MAC de origen y la asocia al puerto por el que recibió la trama. En
    una topología en cascada, este proceso ocurre en cada switch. Cuando PC-B responde,
    S2 aprende la ubicación de PC-B y S1 aprende que PC-B se alcanza a través del
    puerto que conecta con S2. A partir de ese momento, el tráfico entre PC-A y PC-B
    puede reenviarse de forma selectiva.'
  difficulty: hard
  type: scenario
  options:
  - A. S1 enviará la trama solo hacia S2 porque reconoce automáticamente que PC-B
    está en otro switch; después no modificará su tabla MAC.
  - B. S1 aprenderá la MAC de PC-A en Fa0/1 y difundirá la trama por Fa0/2 y Fa0/24;
    S2 aprenderá la MAC de PC-A por su enlace hacia S1 y difundirá hacia PC-B. La
    respuesta de PC-B permitirá que ambos switches aprendan dónde está PC-B.
  - C. S1 descartará la trama porque las tablas MAC están vacías; recién podrá reenviar
    tráfico cuando se configure manualmente cada dirección MAC.
  - D. S1 enviará la trama a PC-C porque está en el puerto más cercano; luego PC-C
    reenviará la trama a S2.
- question: Compara el comportamiento de un bridge y un switch en una red de capa
    2. ¿En qué se parecen y cuál es la diferencia clave en la forma en que manejan
    el tráfico?
  answer: Ambos son dispositivos de capa 2 y trabajan con direcciones MAC, por lo
    que operan dentro de la misma red lógica. El bridge permite extender el alcance
    de la red y replica el tráfico de un lado al otro, mientras que el switch aprende
    qué MAC está conectada a cada puerto y luego envía las tramas solo por la boca
    correspondiente. La diferencia clave es que el switch discrimina el tráfico con
    base en su tabla MAC, reduciendo envíos innecesarios.
  explanation: 'El bridge se presenta como un dispositivo que extiende la red manteniendo
    a los equipos dentro de la misma red y replicando el tráfico entre segmentos.
    El switch también pertenece a capa 2, pero tiene una función más selectiva: construye
    una tabla de direcciones MAC asociadas a puertos y usa esa información para reenviar
    tramas solo hacia el destino correcto. Por eso, aunque ambos usan MAC y no separan
    redes como lo haría un router, el switch administra el tráfico de manera más eficiente.'
  difficulty: medium
  type: comparison
flashcards:
- front: ¿Qué función cumplen los dispositivos de capa 2 en una red?
  back: Preparan los datos para ser transmitidos por la red y reciben datos de la
    red para entregarlos a capas superiores del dispositivo.
  tags:
  - capa-2
  - redes
  - funcion
- front: ¿Qué dirección utilizan los dispositivos de capa 2 para identificar equipos
    en la red?
  back: Utilizan la dirección MAC, que es única e irrepetible para cada dispositivo
    de red.
  tags:
  - capa-2
  - mac
  - direccionamiento
- front: ¿En qué se diferencia un bridge de un switch respecto al manejo del tráfico?
  back: Un bridge extiende el alcance de la misma red y replica el tráfico entre segmentos;
    un switch discrimina el tráfico por dirección MAC y lo envía solo al puerto correspondiente
    cuando conoce el destino.
  tags:
  - bridge
  - switch
  - comparacion
- front: ¿Cómo aprende un switch qué dirección MAC está conectada a cada puerto?
  back: El switch observa las tramas entrantes y registra en su tabla MAC la dirección
    de origen asociada al puerto por donde llegó.
  tags:
  - switch
  - mac
  - aprendizaje
- front: ¿Qué hace un switch cuando no conoce la dirección MAC de destino?
  back: Envía la trama por todos sus puertos, excepto por el puerto de entrada, para
    descubrir dónde está el dispositivo destino.
  tags:
  - switch
  - mac
  - broadcast
practice_exercises:
- title: Implementación y verificación de topologías en cascada con switches de capa
    2
  description: 'En Cisco Packet Tracer, construye y prueba tres topologías diferentes
    usando switches de capa 2 conectados en cascada dentro de una única red LAN. El
    objetivo es comprobar cómo los switches aprenden direcciones MAC, cómo reenvían
    tráfico y cómo se verifica la conectividad básica entre hosts.


    Requisitos:

    1. Diseña e implementa tres topologías distintas, por ejemplo: cascada lineal,
    estrella extendida y árbol jerárquico.

    2. Cada topología debe tener al menos 3 switches y 4 PCs.

    3. Todos los dispositivos finales deben pertenecer a la misma red IP, por ejemplo
    192.168.10.0/24.

    4. Configura cada switch con una configuración básica: hostname único, password
    de consola, password para acceso remoto, enable secret, mensaje banner, dirección
    IP de administración en VLAN 1 y guardado de configuración.

    5. Asigna direcciones IP estáticas a todas las PCs.

    6. Verifica conectividad con comandos como ping, ipconfig y show mac address-table.

    7. Observa cómo cambia la tabla MAC de los switches antes y después de generar
    tráfico entre PCs.


    Entregables:

    - Archivo .pkt con las tres topologías o tres archivos separados.

    - Un archivo .txt por switch con su configuración básica.

    - Una tabla con las direcciones IP asignadas a PCs y switches.

    - Capturas o transcripción de pruebas de ping exitosas.

    - Capturas o transcripción del comando show mac address-table en al menos dos
    switches por topología.

    - Breve conclusión explicando cómo aprendieron los switches las direcciones MAC
    y qué ocurre cuando un switch aún no conoce la MAC destino.'
  difficulty: medium
  type: implementation
  hints:
  - 'Hint 1: Usa cables directos entre PC y switch, y verifica si Packet Tracer selecciona
    correctamente el cable entre switches con la opción automática.'
  - 'Hint 2: Después de crear la topología, ejecuta primero show mac address-table
    antes de hacer ping y luego repítelo después de generar tráfico.'
  - 'Hint 3: Guarda la configuración con copy running-config startup-config para no
    perder los cambios al cerrar el archivo.'
  solution: 'Una solución correcta debe incluir tres topologías funcionales de capa
    2 en una sola red LAN. Ejemplo de direccionamiento: PCs entre 192.168.10.11 y
    192.168.10.20/24; switches con IP de administración 192.168.10.2, 192.168.10.3,
    192.168.10.4, etc., todas en VLAN 1. No es necesario configurar gateway si no
    hay salida a otra red.


    Configuración básica esperada para un switch, adaptando hostname e IP:


    Switch> enable

    Switch# configure terminal

    Switch(config)# hostname SW1

    SW1(config)# no ip domain-lookup

    SW1(config)# enable secret class

    SW1(config)# banner motd #Acceso solo autorizado#

    SW1(config)# line console 0

    SW1(config-line)# password cisco

    SW1(config-line)# login

    SW1(config-line)# exit

    SW1(config)# line vty 0 15

    SW1(config-line)# password cisco

    SW1(config-line)# login

    SW1(config-line)# exit

    SW1(config)# interface vlan 1

    SW1(config-if)# ip address 192.168.10.2 255.255.255.0

    SW1(config-if)# no shutdown

    SW1(config-if)# exit

    SW1(config)# end

    SW1# copy running-config startup-config


    Puntos clave que deben observarse:

    - Todos los pings entre PCs de la misma topología deben ser exitosos.

    - La primera vez que se intenta comunicar una PC con otra, el switch puede inundar
    la trama si aún no conoce la MAC destino.

    - Los switches aprenden direcciones MAC a partir de la dirección MAC origen de
    las tramas que reciben.

    - Luego de generar tráfico, show mac address-table debe mostrar qué direcciones
    MAC están asociadas a cada puerto.

    - En una cascada, los switches pueden aprender varias MAC a través del puerto
    que conecta con otro switch.

    - La conclusión debe diferenciar claramente que el switch no replica todo el tráfico
    por todos los puertos permanentemente, sino que reenvía según su tabla MAC una
    vez aprendidas las direcciones.'
