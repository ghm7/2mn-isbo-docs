summary: 'La unidad 2 introduce el trabajo práctico con dispositivos de capa 2 dentro
  de una red local, especialmente bridges y switches, y conecta la teoría del direccionamiento
  MAC con la implementación de topologías en Cisco Packet Tracer. La tesis central
  es que, para comprender cómo circulan los datos en una LAN, no basta con conocer
  los dispositivos: hay que observar cómo aprenden, reenvían o replican tráfico según
  las direcciones MAC y luego verificar ese comportamiento mediante simulación y comandos
  de diagnóstico.


  La metodología propuesta es progresiva y práctica. Primero se revisa la función
  de los dispositivos de capa 2: preparar datos para circular por la red, recibirlos
  desde el medio físico y entregarlos a capas superiores. Luego se comparan dos dispositivos
  clave. El bridge extiende el alcance de una red y replica tráfico entre segmentos
  que pertenecen a la misma red. El switch, en cambio, aprende qué dirección MAC está
  asociada a cada puerto, construye una tabla interna y reenvía las tramas solo por
  el puerto correspondiente; si desconoce el destino, inunda el tráfico por varios
  puertos hasta aprender la ubicación.


  Después, el curso propone descargar Packet Tracer —preferentemente una versión común
  como 6.2.2 para evitar incompatibilidades—, leer un manual básico y practicar con
  al menos tres topologías diferentes usando switches en cascada dentro de una sola
  red. También se enfatiza la configuración básica de switches mediante consola, el
  uso de contraseñas para consola y Telnet, la asignación de dirección IP de administración
  y la verificación desde PCs mediante comandos de red.


  La conclusión pedagógica es que el dominio de redes se logra practicando: conectar
  equipos, configurar switches, guardar comandos en archivos de texto, usar ayudas
  de la CLI como ? y Tab, diagnosticar conectividad y observar cómo las tablas MAC
  explican el flujo real del tráfico.'
detailed_notes: "## 1. Propósito de la unidad\n\nLa unidad 2 del curso introduce el\
  \ estudio práctico de los **dispositivos de capa 2** y su comportamiento dentro\
  \ de redes locales. El objetivo no es solo reconocer los dispositivos, sino comprender\
  \ cómo procesan tramas, cómo usan direcciones MAC y cómo se configuran y prueban\
  \ en **Cisco Packet Tracer**.\n\nLa unidad se centra en:\n\n- La función de los\
  \ dispositivos de **capa 2 del modelo OSI**.\n- La diferencia entre **bridge** y\
  \ **switch**.\n- El uso de la **dirección MAC** para reenviar tráfico.\n- La creación\
  \ de topologías con **switches en cascada**.\n- La configuración básica de switches\
  \ desde consola.\n- La verificación de conectividad con comandos de red.\n\n## 2.\
  \ Capa 2: función general\n\nLa **capa 2**, también llamada **capa de enlace de\
  \ datos**, se encarga de preparar los datos para que puedan circular por la red\
  \ local y de recibir datos desde el medio físico para entregarlos a capas superiores.\n\
  \nEn términos prácticos, los dispositivos de capa 2 trabajan con **tramas** y no\
  \ principalmente con direcciones IP. Su criterio fundamental de decisión es la **dirección\
  \ MAC**.\n\n### Funciones principales de la capa 2\n\n- Encapsular datos de capas\
  \ superiores en **tramas**.\n- Usar direcciones físicas o **MAC** para identificar\
  \ dispositivos dentro de una red local.\n- Controlar el acceso al medio de transmisión.\n\
  - Permitir la comunicación sobre medios como:\n  - Ethernet por cable de cobre.\n\
  \  - Fibra óptica.\n  - Wi-Fi.\n- Entregar datos recibidos desde la red hacia capas\
  \ superiores del dispositivo.\n\n## 3. Dirección MAC\n\nLa **dirección MAC** es\
  \ la dirección física asociada a una interfaz de red. En la clase se recalca que\
  \ es **única e irrepetible en el mundo**.\n\n### Características importantes\n\n\
  - Identifica una interfaz de red, no necesariamente a una persona o equipo completo.\n\
  - Es usada por bridges y switches para tomar decisiones de reenvío.\n- Opera dentro\
  \ del ámbito de una red local o dominio de capa 2.\n- Normalmente se representa\
  \ en formato hexadecimal, por ejemplo:\n  - `00:1A:2B:3C:4D:5E`\n  - `001A.2B3C.4D5E`\n\
  \n### Relación con el switch\n\nEl switch aprende qué dirección MAC está conectada\
  \ a cada puerto. Con esa información arma una **tabla MAC** o **tabla CAM**, que\
  \ luego usa para reenviar tramas de manera selectiva.\n\n## 4. Bridge\n\nEl **bridge**\
  \ es un dispositivo de capa 2 cuya función principal es extender el alcance de una\
  \ red conectando segmentos.\n\n### Función del bridge\n\n- Extiende el alcance físico\
  \ o lógico de una misma red.\n- Permite conectar dos segmentos que pertenecen al\
  \ mismo dominio de red.\n- Replica tráfico entre los lados conectados.\n\nEn el\
  \ contenido se menciona que, si existe una limitación de alcance físico —por ejemplo,\
  \ un máximo aproximado de 500 metros según el contexto indicado—, el bridge permite\
  \ ampliar ese alcance conectando segmentos.\n\n### Idea clave\n\nEl bridge no crea\
  \ necesariamente una red nueva; une segmentos de la **misma red**. Por eso hay que\
  \ tener presente que los equipos conectados a ambos lados siguen perteneciendo al\
  \ mismo entorno de capa 2.\n\n## 5. Switch\n\nEl **switch** es un dispositivo de\
  \ capa 2 más inteligente que un bridge simple, porque discrimina tráfico según la\
  \ dirección MAC de destino.\n\n### Comportamiento básico del switch\n\nEl switch:\n\
  \n1. Recibe una trama por un puerto.\n2. Observa la **dirección MAC de origen**.\n\
  3. Aprende que esa MAC está asociada al puerto por el cual entró la trama.\n4. Consulta\
  \ su tabla MAC para buscar la **MAC de destino**.\n5. Si conoce el puerto destino,\
  \ reenvía la trama solo por ese puerto.\n6. Si no conoce la MAC destino, envía la\
  \ trama por varios puertos para descubrir dónde está el dispositivo.\n\n### Aprendizaje\
  \ de direcciones MAC\n\nEl switch aprende con el tráfico entrante. Por ejemplo:\n\
  \n- Si la PC A responde desde el puerto FastEthernet 0/1, el switch registra que\
  \ la MAC de PC A está en ese puerto.\n- Si luego otro equipo quiere comunicarse\
  \ con PC A, el switch enviará el tráfico directamente a FastEthernet 0/1.\n\n###\
  \ Reenvío selectivo\n\nA diferencia de un dispositivo que replica todo, el switch\
  \ evita enviar tráfico innecesario a puertos que no corresponden. Esto mejora:\n\
  \n- Rendimiento.\n- Seguridad relativa dentro de la LAN.\n- Eficiencia del ancho\
  \ de banda.\n- Organización del tráfico.\n\n### Cuando el switch no conoce una MAC\n\
  \nSi la dirección MAC de destino no está en su tabla, el switch realiza una acción\
  \ similar a una consulta general:\n\n- Inunda la trama por todos los puertos excepto\
  \ el puerto de entrada.\n- Espera que el equipo destino responda.\n- Al recibir\
  \ la respuesta, aprende por qué puerto se encuentra ese equipo.\n- Actualiza su\
  \ tabla MAC.\n\nEste comportamiento permite que el switch construya su tabla progresivamente\
  \ durante el uso normal de la red.\n\n## 6. Tabla MAC del switch\n\nLa **tabla MAC**\
  \ es una estructura interna del switch donde se asocian direcciones MAC con puertos\
  \ físicos.\n\n### Ejemplo conceptual\n\n| Dirección MAC | Puerto del switch |\n\
  |---|---|\n| `00:AA:BB:CC:DD:01` | Fa0/1 |\n| `00:AA:BB:CC:DD:02` | Fa0/2 |\n| `00:AA:BB:CC:DD:03`\
  \ | Fa0/3 |\n\nSi llega una trama destinada a `00:AA:BB:CC:DD:02`, el switch la\
  \ enviará solo por `Fa0/2`.\n\n### Diagnóstico en Packet Tracer\n\nEn Packet Tracer\
  \ se puede verificar el comportamiento del switch observando:\n\n- Qué equipos están\
  \ conectados a cada puerto.\n- Qué MAC aprendió el switch.\n- Si el tráfico se reenvía\
  \ correctamente.\n- Si existe conectividad entre PCs.\n\nUn comando típico en switches\
  \ Cisco para ver la tabla MAC es:\n\n```text\nshow mac address-table\n```\n\n##\
  \ 7. Topologías con switches en cascada\n\nLa práctica principal consiste en implementar\
  \ al menos **tres topologías diferentes** con switches en cascada usando Packet\
  \ Tracer.\n\n### Qué significa switches en cascada\n\nUna topología en cascada conecta\
  \ switches entre sí, de modo que un switch puede dar conectividad a otros switches\
  \ y a los equipos finales conectados a ellos.\n\nEjemplo simple:\n\n```text\nPC1\
  \ --- SW1 --- SW2 --- PC2\n        |\n       PC3\n```\n\nEjemplo con tres switches:\n\
  \n```text\nPC1 --- SW1 --- SW2 --- SW3 --- PC4\n        |       |       |\n    \
  \   PC2     PC3     PC5\n```\n\n### Condición importante de la tarea\n\nLas topologías\
  \ deben considerar **una sola red**. Esto implica que los equipos deben pertenecer\
  \ al mismo rango de red IP, salvo que se indique lo contrario.\n\nEjemplo de una\
  \ sola red:\n\n| Equipo | IP | Máscara |\n|---|---|---|\n| PC1 | `192.168.1.10`\
  \ | `255.255.255.0` |\n| PC2 | `192.168.1.11` | `255.255.255.0` |\n| PC3 | `192.168.1.12`\
  \ | `255.255.255.0` |\n| Switch 1 administración | `192.168.1.2` | `255.255.255.0`\
  \ |\n| Switch 2 administración | `192.168.1.3` | `255.255.255.0` |\n\nTodos pertenecen\
  \ a la red `192.168.1.0/24`.\n\n## 8. Cisco Packet Tracer\n\n**Packet Tracer** es\
  \ el simulador recomendado para practicar las topologías y configuraciones. La clase\
  \ sugiere usar una versión común, como **Packet Tracer 6.2.2**, para evitar problemas\
  \ de compatibilidad y porque no exige necesariamente pertenecer a Cisco Networking\
  \ Academy en ese contexto.\n\n### Razones para usar la misma versión\n\n- Evitar\
  \ incompatibilidades al abrir archivos de otros estudiantes.\n- Asegurar que los\
  \ dispositivos y comandos disponibles sean los mismos.\n- Facilitar la corrección\
  \ y comparación de prácticas.\n\n### Primer paso recomendado\n\nAntes de configurar,\
  \ se debe descargar y leer un **manual básico** del simulador. El material mencionado\
  \ tiene aproximadamente 8 páginas y sirve para entender:\n\n- Cómo insertar dispositivos.\n\
  - Cómo conectar cables.\n- Cómo abrir terminales.\n- Cómo configurar PCs y switches.\n\
  - Cómo probar conectividad.\n\n## 9. Configuración básica de switches\n\nLa clase\
  \ indica que existe una configuración básica que se replica en todos los switches,\
  \ haciendo las modificaciones necesarias para cada sitio o dispositivo.\n\n### Elementos\
  \ habituales de una configuración básica\n\nUna configuración básica de switch suele\
  \ incluir:\n\n- Nombre del dispositivo o hostname.\n- Contraseña de consola.\n-\
  \ Contraseña para acceso remoto por Telnet.\n- Contraseña de modo privilegiado.\n\
  - Dirección IP de administración.\n- Activación de la interfaz VLAN de administración.\n\
  - Mensaje de advertencia o banner.\n- Guardado de la configuración.\n\n### Ejemplo\
  \ representativo de configuración básica Cisco IOS\n\nEste ejemplo no sustituye\
  \ la configuración específica del curso, pero muestra el tipo de comandos que normalmente\
  \ aparecen:\n\n```text\nenable\nconfigure terminal\nhostname SW1\n\nenable secret\
  \ class\n\nline console 0\npassword cisco\nlogin\nexit\n\nline vty 0 4\npassword\
  \ cisco\nlogin\nexit\n\ninterface vlan 1\nip address 192.168.1.2 255.255.255.0\n\
  no shutdown\nexit\n\nbanner motd #Acceso solo autorizado#\n\nend\ncopy running-config\
  \ startup-config\n```\n\n### Precaución sobre contraseñas\n\nLa clase advierte que\
  \ puede haber diferencias entre:\n\n- Contraseña de **consola**.\n- Contraseña de\
  \ **Telnet** o líneas VTY.\n- Contraseña de modo privilegiado.\n\nPor eso se recomienda\
  \ registrar cuidadosamente las contraseñas en un bloc de notas y, si se cambian,\
  \ mantener la documentación actualizada.\n\n## 10. Conexión por consola\n\nPara\
  \ configurar un switch inicialmente, se utiliza normalmente un **cable de consola**,\
  \ identificado en Packet Tracer como el cable celeste.\n\n### Procedimiento general\n\
  \n1. Colocar una PC y un switch en el escenario.\n2. Conectar la PC al switch usando\
  \ el cable de consola.\n3. Abrir la PC.\n4. Entrar en la herramienta **Terminal**.\n\
  5. Usar la configuración por defecto de la terminal.\n6. Acceder a la CLI del switch.\n\
  7. Cargar o escribir la configuración básica.\n\n### Configuración de terminal típica\n\
  \nPacket Tracer suele mostrar valores por defecto como:\n\n- Bits por segundo: `9600`\n\
  - Bits de datos: `8`\n- Paridad: `None`\n- Bits de parada: `1`\n- Control de flujo:\
  \ `None`\n\nEstos valores permiten acceder a la consola del switch.\n\n## 11. Guardar\
  \ configuraciones en archivos de texto\n\nLa clase recomienda guardar la configuración\
  \ en un **bloc de notas** o en varios archivos, según la cantidad de dispositivos.\n\
  \n### Por qué guardar la configuración\n\n- Evita perder trabajo.\n- Permite corregir\
  \ errores fácilmente.\n- Facilita replicar la configuración en otros switches.\n\
  - Ayuda a documentar contraseñas, direcciones IP y nombres de dispositivos.\n- Permite\
  \ comparar configuraciones entre equipos.\n\n### Organización sugerida\n\nUsar un\
  \ archivo por dispositivo:\n\n```text\nSW1_config.txt\nSW2_config.txt\nSW3_config.txt\n\
  PCs_direcciones_IP.txt\n```\n\nO un único archivo organizado por secciones:\n\n\
  ```text\n=== SW1 ===\n...\n\n=== SW2 ===\n...\n\n=== SW3 ===\n...\n```\n\n## 12.\
  \ Verificación desde PCs\n\nUna vez configurados los switches y asignadas las direcciones\
  \ IP, se deben probar comandos de red desde las PCs.\n\n### Comandos útiles en PCs\
  \ de Packet Tracer\n\n| Comando | Uso |\n|---|---|\n| `ipconfig` | Verifica la dirección\
  \ IP, máscara y gateway configurados en una PC. |\n| `ping <IP>` | Comprueba conectividad\
  \ con otro equipo. |\n| `arp -a` | Muestra asociaciones IP-MAC conocidas por la\
  \ PC. |\n| `tracert <IP>` | Muestra la ruta hacia un destino, útil especialmente\
  \ cuando hay routers. |\n\n### Ejemplo de prueba\n\nSi PC1 tiene `192.168.1.10`\
  \ y PC2 tiene `192.168.1.11`, desde PC1 se puede ejecutar:\n\n```text\nping 192.168.1.11\n\
  ```\n\nSi hay respuesta, ambas PCs están comunicadas dentro de la red.\n\n## 13.\
  \ Ayudas de la línea de comandos Cisco\n\nLa clase destaca que Cisco IOS ofrece\
  \ ayudas muy útiles para aprender y configurar.\n\n### Tecla `?`\n\nMuestra ayuda\
  \ contextual.\n\nEjemplos:\n\n```text\nSwitch> ?\nSwitch# show ?\nSwitch(config)#\
  \ line ?\n```\n\nSirve para descubrir qué comandos están disponibles en el modo\
  \ actual.\n\n### Tecla Tab\n\nCompleta comandos automáticamente.\n\nEjemplo:\n\n\
  ```text\nconf<Tab>\n```\n\nPuede completarse como:\n\n```text\nconfigure\n```\n\n\
  ### Flecha hacia arriba\n\nRecupera comandos anteriores. Es útil para repetir o\
  \ corregir comandos sin volver a escribirlos desde cero.\n\n## 14. Tareas de la\
  \ unidad\n\n### Tarea 1: identificar la utilidad de los comandos\n\nEl primer trabajo\
  \ consiste en leer la configuración básica propuesta e identificar para qué sirve\
  \ cada comando.\n\nDebe responderse, por ejemplo:\n\n- ¿Qué hace `hostname`?\n-\
  \ ¿Para qué sirve `enable secret`?\n- ¿Qué configura `line console 0`?\n- ¿Cuál\
  \ es la función de `line vty 0 4`?\n- ¿Por qué se asigna IP a `interface vlan 1`?\n\
  - ¿Por qué se debe guardar la configuración?\n\n### Tarea 2: implementar topologías\
  \ en Packet Tracer\n\nEl segundo trabajo consiste en usar Packet Tracer para implementar\
  \ al menos **tres topologías diferentes** con switches en cascada.\n\nCondiciones:\n\
  \n- Usar una sola red.\n- Configurar los switches según la configuración básica.\n\
  - Ajustar direcciones IP y nombres de dispositivos según corresponda.\n- Conectar\
  \ PCs y switches con los cables adecuados.\n- Verificar conectividad con comandos\
  \ de red.\n- Guardar el archivo `.pkt` y las configuraciones en texto.\n\n## 15.\
  \ Criterio de aprendizaje de la unidad\n\nLa unidad insiste en la práctica constante.\
  \ La idea central es que el estudiante no solo copie comandos, sino que entienda\
  \ qué ocurre:\n\n- Cómo se conecta físicamente una red.\n- Cómo se configura un\
  \ switch.\n- Cómo se aprende una dirección MAC.\n- Cómo se reenvía una trama.\n\
  - Cómo se diagnostica si una red funciona.\n- Cómo se documenta una práctica.\n\n\
  La recomendación final es practicar todo lo posible, porque Packet Tracer es intuitivo\
  \ y permite ensayar sin riesgo antes de trabajar con equipos reales."
key_concepts:
- 'Capa 2 del modelo OSI: capa encargada de mover tramas dentro de una red local usando
  direcciones físicas MAC.'
- 'Trama Ethernet: unidad de datos de capa 2 que contiene direcciones MAC de origen
  y destino para permitir el reenvío local.'
- 'Dirección MAC: identificador físico único de una interfaz de red usado por switches
  y bridges para reconocer dispositivos.'
- 'Dominio de capa 2: conjunto de dispositivos que pueden comunicarse directamente
  mediante tramas sin necesidad de un router.'
- 'Bridge: dispositivo de capa 2 que conecta segmentos de una misma red y extiende
  su alcance replicando tráfico entre ellos.'
- 'Switch: dispositivo de capa 2 que aprende direcciones MAC por puerto y reenvía
  tramas de forma selectiva.'
- 'Tabla MAC: registro interno del switch que asocia direcciones MAC con puertos físicos
  de entrada.'
- 'Aprendizaje MAC: proceso mediante el cual un switch observa la MAC de origen de
  las tramas entrantes y la vincula al puerto correspondiente.'
- 'Reenvío selectivo: acción del switch de enviar una trama solo por el puerto donde
  se encuentra la MAC destino conocida.'
- 'Inundación de tráfico: envío de una trama por múltiples puertos cuando el switch
  desconoce la ubicación de la MAC destino.'
- 'Switches en cascada: topología donde varios switches se conectan entre sí para
  ampliar la cantidad de equipos dentro de una misma red.'
- 'Packet Tracer: simulador de redes de Cisco usado para diseñar topologías, configurar
  dispositivos y probar conectividad.'
- 'Conexión por consola: método de administración local inicial de un switch usando
  una PC, cable de consola y terminal.'
- 'CLI Cisco IOS: interfaz de línea de comandos usada para configurar y diagnosticar
  dispositivos Cisco.'
- 'Configuración básica de switch: conjunto mínimo de comandos para nombrar, proteger,
  direccionar y guardar la configuración de un switch.'
glossary:
- term: Capa 2
  definition: Nivel del modelo OSI encargado del enlace de datos, donde se encapsulan
    datos en tramas y se usan direcciones MAC para comunicación local.
  related_terms:
  - Modelo OSI
  - Trama
  - Dirección MAC
  - Switch
- term: Modelo OSI
  definition: Modelo conceptual de siete capas que organiza las funciones de comunicación
    de red; la unidad se enfoca en la capa de enlace de datos.
  related_terms:
  - Capa 2
  - Capa física
  - Capa de red
- term: Dirección MAC
  definition: Identificador físico único asociado a una interfaz de red, utilizado
    por dispositivos de capa 2 para reenviar tramas.
  related_terms:
  - Tabla MAC
  - Ethernet
  - NIC
- term: Trama
  definition: Unidad de información de capa 2 que transporta datos e incluye direcciones
    MAC de origen y destino.
  related_terms:
  - Ethernet
  - Capa 2
  - Encapsulación
- term: Ethernet
  definition: Tecnología de red local que usa tramas y direcciones MAC para comunicar
    dispositivos en una LAN cableada.
  related_terms:
  - Trama
  - LAN
  - Switch
- term: Fibra óptica
  definition: Medio físico de transmisión que usa luz para transportar datos y puede
    formar parte de redes Ethernet.
  related_terms:
  - Medio físico
  - Ethernet
  - Capa física
- term: Wi-Fi
  definition: Tecnología inalámbrica de red local que también utiliza direccionamiento
    MAC para identificar interfaces.
  related_terms:
  - Dirección MAC
  - LAN inalámbrica
  - Capa 2
- term: Bridge
  definition: Dispositivo de capa 2 que conecta segmentos de una misma red y extiende
    el alcance replicando tráfico entre lados.
  related_terms:
  - Switch
  - Segmento de red
  - Dominio de capa 2
- term: Switch
  definition: Dispositivo de capa 2 que aprende direcciones MAC por puerto y reenvía
    tráfico solo hacia el puerto adecuado cuando conoce el destino.
  related_terms:
  - Tabla MAC
  - Reenvío selectivo
  - Puerto
- term: Puerto de switch
  definition: Interfaz física o lógica del switch por la que se conectan PCs, otros
    switches u otros dispositivos de red.
  related_terms:
  - Switch
  - Tabla MAC
  - FastEthernet
- term: Tabla MAC
  definition: Tabla interna del switch que relaciona cada dirección MAC aprendida
    con el puerto por donde fue vista.
  related_terms:
  - Aprendizaje MAC
  - CAM
  - Switch
- term: Tabla CAM
  definition: Nombre técnico frecuente para la memoria usada por switches para almacenar
    asociaciones MAC-puerto.
  related_terms:
  - Tabla MAC
  - Switch
  - Reenvío
- term: Aprendizaje MAC
  definition: Proceso automático mediante el cual un switch registra la MAC de origen
    de una trama en el puerto por el que ingresó.
  related_terms:
  - Tabla MAC
  - Switch
  - Trama
- term: Inundación
  definition: Mecanismo por el cual un switch envía una trama por múltiples puertos
    cuando desconoce la MAC de destino.
  related_terms:
  - MAC desconocida
  - Broadcast
  - Switch
- term: Topología
  definition: Distribución física o lógica de dispositivos y conexiones dentro de
    una red.
  related_terms:
  - Packet Tracer
  - Switches en cascada
  - LAN
- term: Switches en cascada
  definition: Diseño donde varios switches se conectan entre sí para ampliar la red
    local y conectar más dispositivos.
  related_terms:
  - Topología
  - Switch
  - Dominio de capa 2
- term: Packet Tracer
  definition: Simulador de redes de Cisco que permite construir topologías, conectar
    dispositivos, configurar equipos y probar tráfico.
  related_terms:
  - Cisco IOS
  - CLI
  - Simulación
- term: Cable de consola
  definition: Cable usado para conectar una PC al puerto de consola de un switch y
    realizar configuración local inicial.
  related_terms:
  - Consola
  - Terminal
