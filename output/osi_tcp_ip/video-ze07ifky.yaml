timeline: []
cheat_sheet: "## Capa 2 y Packet Tracer — Referencia rápida\n\n### Función de capa\
  \ 2\n\n| Elemento | Idea clave |\n|---|---|\n| Capa 2 | Mueve **tramas** dentro\
  \ de una LAN. |\n| Dirección MAC | Identifica interfaces de red; usada por switches.\
  \ |\n| Bridge | Extiende una misma red y replica tráfico. |\n| Switch | Aprende\
  \ MAC por puerto y reenvía selectivamente. |\n| Tabla MAC | Asociación `MAC -> puerto`.\
  \ |\n\n### Comportamiento del switch\n\n```text\n1. Recibe trama.\n2. Lee MAC de\
  \ origen.\n3. Aprende: MAC origen = puerto de entrada.\n4. Busca MAC destino en\
  \ tabla MAC.\n5. Si la conoce: envía solo por ese puerto.\n6. Si no la conoce: inunda\
  \ por varios puertos.\n```\n\n### Bridge vs Switch\n\n| Dispositivo | Qué hace |\
  \ Limitación/ventaja |\n|---|---|---|\n| Bridge | Une segmentos de la misma red\
  \ | Replica tráfico entre lados. |\n| Switch | Separa tráfico por MAC | Reduce tráfico\
  \ innecesario. |\n\n### Práctica en Packet Tracer\n\n- Instalar una versión común,\
  \ preferentemente la indicada por el curso.\n- Leer el manual básico antes de configurar.\n\
  - Crear **3 topologías distintas** con switches en cascada.\n- Mantener **una sola\
  \ red IP**.\n- Configurar cada switch.\n- Probar conectividad con comandos.\n- Guardar\
  \ `.pkt` y configuraciones en `.txt`.\n\n### Conexión por consola\n\n```text\nPC\
  \ --- cable consola celeste --- Switch\nPC > Desktop > Terminal > aceptar valores\
  \ por defecto\n```\n\nValores típicos:\n\n| Parámetro | Valor |\n|---|---|\n| Speed\
  \ | 9600 |\n| Data bits | 8 |\n| Parity | None |\n| Stop bits | 1 |\n| Flow control\
  \ | None |\n\n### Configuración básica típica de switch\n\n```text\nenable\nconfigure\
  \ terminal\nhostname SW1\nenable secret class\nline console 0\n password cisco\n\
  \ login\nexit\nline vty 0 4\n password cisco\n login\nexit\ninterface vlan 1\n ip\
  \ address 192.168.1.2 255.255.255.0\n no shutdown\nexit\nend\ncopy running-config\
  \ startup-config\n```\n\n### Comandos útiles\n\n| Lugar | Comando | Uso |\n|---|---|---|\n\
  | Switch | `show mac address-table` | Ver MAC aprendidas por puerto. |\n| Switch\
  \ | `show running-config` | Ver configuración activa. |\n| Switch | `copy running-config\
  \ startup-config` | Guardar configuración. |\n| PC | `ipconfig` | Ver IP y máscara.\
  \ |\n| PC | `ping <IP>` | Probar conectividad. |\n| PC | `arp -a` | Ver relaciones\
  \ IP-MAC. |\n\n### Ayudas CLI\n\n| Tecla | Función |\n|---|---|\n| `?` | Muestra\
  \ ayuda contextual. |\n| `Tab` | Autocompleta comandos. |\n| Flecha arriba | Recupera\
  \ comandos anteriores. |"
takeaways:
- Construye tres topologías diferentes con switches en cascada y mantén todos los
  equipos dentro de una sola red IP.
- Configura cada switch desde consola usando un archivo de texto como plantilla y
  ajustando hostname, IP y contraseñas.
- Documenta todas las direcciones IP, contraseñas, nombres de dispositivos y puertos
  usados antes de probar la red.
- Verifica conectividad entre PCs con `ping` y confirma la configuración local con
  `ipconfig`.
- Observa la tabla MAC del switch antes y después de generar tráfico para comprobar
  cómo aprende direcciones.
- Practica el uso de `?`, `Tab` y la flecha hacia arriba en la CLI hasta poder navegar
  comandos sin depender de memoria exacta.
- Compara el comportamiento de un bridge y un switch explicando cuándo se replica
  tráfico y cuándo se reenvía selectivamente.
- Guarda la configuración activa en cada switch para evitar perder cambios al reiniciar
  el dispositivo.
- 'Corrige fallos de conectividad siguiendo una secuencia: cableado, IP, máscara,
  estado de interfaces, tabla MAC y prueba de ping.'
learning_path:
  prerequisites:
  - Comprender la idea general de una red local o LAN.
  - Conocer el modelo OSI a nivel introductorio, especialmente capas física, enlace
    de datos y red.
  - Distinguir entre dirección MAC y dirección IP.
  - 'Saber usar una computadora básica: abrir programas, editar archivos de texto
    y trabajar con ventanas.'
  - Tener nociones mínimas de cableado de red y conexión entre PCs y switches.
  next_steps:
  - Estudiar VLANs para comprender cómo dividir una red de capa 2 en dominios lógicos
    separados.
  - Aprender Spanning Tree Protocol para evitar bucles en topologías con switches
    redundantes.
  - Profundizar en direccionamiento IP, subredes y gateways para pasar de redes de
    capa 2 a redes enrutadas.
  - Configurar acceso remoto seguro por SSH en lugar de Telnet.
  - Practicar resolución sistemática de fallas con comandos como `show interfaces`,
    `show vlan brief`, `show running-config` y `show mac address-table`.
  - Estudiar routers y capa 3 para conectar redes diferentes.
  - Explorar seguridad básica de switch, como port security, contraseñas cifradas
    y desactivación de puertos no usados.
