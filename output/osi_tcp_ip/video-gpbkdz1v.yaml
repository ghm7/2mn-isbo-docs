cheat_sheet: '## Two Routed LANs: Quick Reference


  ### Topology


  ```text

  LAN A PCs ─ Switch A ─ Router A ─ WAN ─ Router B ─ Switch B ─ LAN B PCs

  ```


  ### Configure Each Router


  | Task | Router A example | Router B example |

  |---|---|---|

  | Name router | RouterA | RouterB |

  | LAN interface IP | 192.168.1.100/24 | 192.168.2.200/24 |

  | WAN interface IP | 10.0.0.1 | 10.0.0.2 |

  | Enable ports | Required | Required |

  | Routing protocol | Advertise LAN A + WAN | Advertise LAN B + WAN |


  ### Configure Each PC


  | PC setting | LAN A PC example | LAN B PC example |

  |---|---:|---:|

  | IP address | 192.168.1.10 | 192.168.2.10 |

  | Subnet mask | 255.255.255.0 | 255.255.255.0 |

  | Default gateway | 192.168.1.100 | 192.168.2.200 |


  ### Rules to Remember


  - The **default gateway** is the router interface on the same LAN as the PC.

  - Router interfaces need: **IP address + subnet mask + enabled port**.

  - Switches only need correct cabling for this basic scenario.

  - Dynamic routing works only if the correct connected networks are advertised.

  - Test both directions: LAN A to LAN B and LAN B to LAN A.


  ### Testing Commands


  ```text

  ping <remote-PC-IP>

  ```


  Recommended troubleshooting sequence:


  ```text

  1. Ping local gateway.

  2. Ping remote router WAN IP.

  3. Ping remote router LAN IP.

  4. Ping remote PC.

  ```


  ### If Ping Fails, Check


  | Symptom | Likely cause |

  |---|---|

  | Cannot ping local gateway | PC IP/mask/gateway wrong, cable issue, router LAN
  port off |

  | Can ping gateway but not remote network | Routing protocol or WAN interface issue
  |

  | One direction works poorly or not at all | Missing route or wrong default gateway
  on return side |

  | Router interface shows down | Port not enabled or cable/interface mismatch |'
takeaways:
- Draw the topology before configuring devices, labeling each LAN, router interface,
  and WAN address.
- Assign every router interface an IP address and subnet mask that match the network
  segment it connects to.
- Enable router interfaces after addressing them so the ports become operational.
- Configure each PC with a default gateway equal to the router interface on its own
  LAN.
- Advertise the correct connected networks in the dynamic routing protocol on both
  routers.
- Use ping in both directions to confirm that routing works end to end.
- Troubleshoot progressively by testing the local gateway, WAN link, remote router,
  and final PC.
- Document the final addressing table so future errors can be found quickly.
learning_path:
  prerequisites:
  - Basic understanding of IP addresses and subnet masks.
  - Ability to distinguish LANs, WANs, routers, switches, and PCs.
  - Familiarity with using a network simulator such as Cisco Packet Tracer.
  - Basic command-line usage, especially the ping command.
  - Understanding that devices in different subnets require a router to communicate.
  next_steps:
  - Study static routing and compare it with dynamic routing.
  - Learn a specific dynamic routing protocol such as RIP, OSPF, or EIGRP.
  - Practice subnetting, including /24 and /30 addressing for LAN and point-to-point
    links.
  - Learn how to inspect router routing tables and interface status from the CLI.
  - Build larger topologies with three or more routers and multiple remote LANs.
  - Explore VLANs and router-on-a-stick to understand how multiple LANs can share
    physical infrastructure.
  - Practice structured troubleshooting using OSI layers and command outputs.
  resources:
  - 'Cisco Packet Tracer: https://www.netacad.com/cisco-packet-tracer'
  - 'Cisco Networking Academy - Introduction to Networks course: https://www.netacad.com/courses/networking'
  - 'Book: Wendell Odom, CCNA 200-301 Official Cert Guide, Volume 1.'
  - 'Book: James Kurose and Keith Ross, Computer Networking: A Top-Down Approach.'
  - 'Cisco documentation on IP routing: https://www.cisco.com/c/en/us/support/ip/ip-routing/tsd-products-support-series-home.html'
  - 'Practical tool: Wireshark for observing ICMP and routing-related traffic: https://www.wireshark.org/'
  - 'Practice topic: RIP configuration in Packet Tracer labs.'
  - 'Practice topic: OSPF single-area configuration and verification.'
quiz_questions:
- question: In the PC IP configuration, the field that must contain the router's LAN-interface
    address so the machine can reach other networks is called the _____.
  answer: default gateway
  explanation: 'Each PC can communicate directly only with devices in its own local
    network. To reach another routed network, it sends traffic to a next-hop device:
    the router interface connected to that LAN. That address is entered in the PC
    configuration as the default gateway.'
  difficulty: easy
  type: fill_blank
- question: What configuration is required on the switch in the setup described?
  answer: C. No routing configuration is needed; it only needs to be connected with
    the correct cables.
  explanation: The content explains that the switch is simply connected with cables
    and does not require routing configuration. The routers perform the inter-network
    routing, while the switch operates inside the local network to connect devices
    at the LAN level. Setting a routing protocol, WAN address, or default gateway
    role on the switch would misunderstand its function in this topology.
  difficulty: medium
  type: multiple_choice
  options:
  - A. Configure the switch with the same dynamic routing protocol as the routers.
  - B. Assign the switch the WAN address so it can forward packets between routers.
  - C. No routing configuration is needed; it only needs to be connected with the
    correct cables.
  - D. Set the switch as the default gateway for all PCs in the LAN.
- question: Compare the purpose of configuring router interfaces with IP addresses
    versus adding networks to the dynamic routing protocol. Why are both needed for
    the two LANs to communicate?
  answer: 'Assigning IP addresses to router interfaces makes each physical or logical
    connection usable: one interface connects to the local LAN and another to the
    WAN link between routers. Adding networks to the dynamic routing protocol tells
    the routers which networks to advertise and learn, allowing each router to know
    how to reach the remote LAN. Both are needed because interfaces provide the actual
    connected paths, while dynamic routing provides the route information needed to
    forward traffic beyond directly connected networks.'
  explanation: Interface configuration and routing configuration solve different problems.
    A router cannot send or receive packets on an interface unless that interface
    has the correct IP address, mask, and is enabled. However, even with working interfaces,
    a router also needs routing information to know where remote networks are located.
    Dynamic routing shares those network reachability details between routers so packets
    can travel from one LAN, across the WAN link, to the other LAN.
  difficulty: medium
  type: comparison
- question: A lab has two LANs connected by two routers. Router A has a LAN interface
    for the left network and a WAN address of 10.0.0.1. Router B has a LAN interface
    for the right network and a WAN address of 10.0.0.2. Dynamic routing has been
    configured with the LAN networks and the WAN network on both routers. The PCs
    on the right LAN were given correct local IP addresses, but their default gateway
    was accidentally set to 10.0.0.2 instead of Router B's LAN-interface address.
    What is the most likely result and best correction?
  answer: B. The right-side PCs may fail to reach remote networks because their gateway
    is not on their local LAN; set their gateway to Router B's LAN-interface address.
  explanation: A PC's default gateway must be reachable on the PC's own local network.
    The WAN address 10.0.0.2 belongs to Router B's router-to-router link, not to the
    right LAN segment where the PCs are connected. Even though 10.0.0.2 is an address
    on Router B, the PCs cannot properly use it as their next hop if it is not in
    their local subnet. The correct gateway is the IP address of Router B's LAN-facing
    interface, because that is the interface that gives the PCs an exit toward the
    rest of the routed topology.
  difficulty: hard
  type: scenario
  options:
  - A. Communication will work normally because 10.0.0.2 is still on Router B.
  - B. The right-side PCs may fail to reach remote networks because their gateway
    is not on their local LAN; set their gateway to Router B's LAN-interface address.
  - C. Only dynamic routing needs to be restarted because the PC gateway does not
    affect end-host communication.
  - D. The switch must be configured with 10.0.0.2 so it can translate LAN traffic
    to the WAN.
flashcards:
- front: ¿Qué dirección debe configurarse como gateway predeterminado en una PC de
    una LAN?
  back: Debe configurarse la dirección IP de la interfaz LAN del router conectado
    a esa red, porque es la salida hacia otras redes.
  tags:
  - redes
  - gateway
  - configuracion-ip
- front: ¿Por qué es necesario agregar las redes locales y la red WAN en el protocolo
    de ruteo del router?
  back: Porque el ruteo dinámico necesita conocer qué redes debe anunciar y usar para
    enviar tráfico entre redes interconectadas.
  tags:
  - ruteo
  - ruteo-dinamico
  - router
- front: ¿Cómo se configuran las interfaces de un router para interconectar dos redes?
  back: Se asigna a cada interfaz la IP y máscara correspondientes a su red, y luego
    se habilitan los puertos.
  tags:
  - router
  - interfaces
  - configuracion
- front: ¿Cuál es la diferencia entre configurar un switch y configurar un router
    en este escenario?
  back: El switch solo se conecta físicamente con los cables; el router requiere configurar
    interfaces, redes de ruteo y habilitar puertos.
  tags:
  - switch
  - router
  - comparacion
- front: ¿Cómo se verifica que dos PCs en redes distintas quedaron correctamente interconectadas?
  back: Se abre el símbolo del sistema en una PC y se envía un ping a la IP de la
    PC de la otra red; si hay respuesta, la conectividad funciona.
  tags:
  - conectividad
  - ping
  - pruebas
practice_exercises:
- title: Configurar y verificar dos redes LAN interconectadas mediante routers
  description: "Construye una topología de red con dos LAN separadas conectadas entre\
    \ sí por dos routers. Cada LAN debe tener al menos un switch y dos PCs. Los routers\
    \ estarán conectados entre sí mediante una red WAN. Debes configurar direcciones\
    \ IP en las interfaces LAN y WAN de los routers, activar los puertos, configurar\
    \ las IP y gateways de las PCs, habilitar un protocolo de ruteo dinámico o rutas\
    \ adecuadas para que ambas LAN puedan comunicarse, y comprobar la conectividad\
    \ con pruebas de ping en ambos sentidos.\n\nRequisitos mínimos de la topología:\n\
    - LAN izquierda: red 192.168.1.0/24\n- LAN derecha: red 192.168.2.0/24\n- Enlace\
    \ WAN entre routers: red 10.0.0.0/30\n- Router izquierdo:\n  - Interfaz LAN: 192.168.1.1/24\n\
    \  - Interfaz WAN: 10.0.0.1/30\n- Router derecho:\n  - Interfaz LAN: 192.168.2.1/24\n\
    \  - Interfaz WAN: 10.0.0.2/30\n- PCs de la LAN izquierda: direcciones dentro\
    \ de 192.168.1.0/24, gateway 192.168.1.1\n- PCs de la LAN derecha: direcciones\
    \ dentro de 192.168.2.0/24, gateway 192.168.2.1\n\nEntregables:\n1. Un diagrama\
    \ o captura de la topología construida.\n2. Una tabla de direccionamiento IP con\
    \ routers, interfaces, PCs, máscaras y gateways.\n3. Capturas o resultados de\
    \ configuración de rutas/ruteo dinámico en ambos routers.\n4. Evidencia de conectividad:\
    \ ping exitoso desde una PC de la LAN izquierda hacia una PC de la LAN derecha\
    \ y viceversa.\n5. Breve explicación de por qué el gateway configurado en cada\
    \ PC permite alcanzar la red remota."
  difficulty: medium
  type: implementation
  hints:
  - 'Hint 1: Recuerda encender o habilitar las interfaces de los routers; una IP correcta
    no funcionará si el puerto está apagado.'
  - 'Hint 2: El gateway de cada PC debe ser la dirección IP de la interfaz LAN del
    router que pertenece a su propia red.'
  - 'Hint 3: Si usas ruteo dinámico, anuncia las redes LAN y la red WAN en ambos routers;
    si usas rutas estáticas, cada router debe conocer la red remota a través de la
    IP WAN del otro router.'
  solution: 'Una solución válida debe incluir una topología con dos LAN conectadas
    por dos routers mediante una red WAN. La tabla de direccionamiento puede ser:


    LAN izquierda:

    - Router R1, interfaz LAN: 192.168.1.1/24

    - PC1: 192.168.1.10/24, gateway 192.168.1.1

    - PC2: 192.168.1.11/24, gateway 192.168.1.1


    WAN:

    - R1, interfaz WAN: 10.0.0.1/30

    - R2, interfaz WAN: 10.0.0.2/30


    LAN derecha:

    - Router R2, interfaz LAN: 192.168.2.1/24

    - PC3: 192.168.2.10/24, gateway 192.168.2.1

    - PC4: 192.168.2.11/24, gateway 192.168.2.1


    Las interfaces de ambos routers deben estar activas. Para el ruteo, puede usarse
    RIP, por ejemplo:


    En R1:

    - Anunciar 192.168.1.0

    - Anunciar 10.0.0.0


    En R2:

    - Anunciar 192.168.2.0

    - Anunciar 10.0.0.0


    También sería correcto usar rutas estáticas:

    - En R1: ruta hacia 192.168.2.0/24 vía 10.0.0.2

    - En R2: ruta hacia 192.168.1.0/24 vía 10.0.0.1


    La verificación esperada es que un ping desde PC1, por ejemplo 192.168.1.10, hacia
    PC3, 192.168.2.10, responda correctamente. También debe responder un ping desde
    PC3 hacia PC1. La explicación clave es que cada PC envía el tráfico destinado
    a redes externas a su gateway local; luego los routers usan sus rutas para reenviar
    los paquetes a través del enlace WAN hasta la red remota.'
