source_type: video
source_ref: https://www.youtube.com/watch?v=gpbKDz1VeOs
summary: 'The content demonstrates how to interconnect two local area networks through
  two routers using interface configuration, dynamic routing, host IP settings, and
  connectivity testing. The central thesis is that two separate LANs can communicate
  only when each router knows its directly connected networks, advertises or learns
  routes to remote networks, has its physical/logical interfaces enabled, and each
  end host uses the router LAN interface as its default gateway.


  The methodology follows a practical router-configuration workflow, likely in a network
  simulator such as Cisco Packet Tracer. First, each router is opened in the configuration
  interface and assigned a name to identify its role or location. Then the routing
  protocol configuration is used to add the networks that each router must advertise.
  The example refers to two local networks plus a WAN/inter-router network, with WAN
  addresses such as 10.0.0.1 on one router and 10.0.0.2 on the other. Next, each router
  interface is configured with the correct IP address and subnet mask: one interface
  connects to the local LAN and the other to the WAN link. A critical operational
  step is enabling both router ports; without this, the interfaces remain administratively
  down.


  After router setup, each PC is configured with its own local IP address, subnet
  mask, and default gateway. The default gateway must be the IP address of the router
  interface connected to that LAN, because that address is the exit point toward other
  networks. Switches require no routing configuration in this scenario; they simply
  provide Layer 2 connectivity among local devices.


  Finally, connectivity is verified using the command prompt by sending test messages,
  typically with ping, from a PC on one LAN to a PC on the remote LAN and then in
  the opposite direction. Successful replies confirm that interface addressing, default
  gateways, routing advertisements, and physical connections are working correctly.'
detailed_notes: '## 1. Purpose of the Configuration


  The lesson explains how to make **two separate local networks communicate through
  routers**. Each LAN is connected to its own router, and the routers are connected
  to each other through a WAN or point-to-point network.


  The overall goal is to confirm that:


  - Devices inside LAN A can communicate with devices inside LAN B.

  - Devices inside LAN B can communicate with devices inside LAN A.

  - Routers are correctly configured with IP addresses, masks, enabled interfaces,
  and routing information.

  - PCs are correctly configured with IP address, subnet mask, and **default gateway**.


  ## 2. Network Topology


  The implied topology is:


  ```text

  PCs LAN A ── Switch A ── Router A ── WAN link ── Router B ── Switch B ── PCs LAN
  B

  ```


  ### Main components


  - **Router A**: router connected to the left-side LAN and the inter-router WAN.

  - **Router B**: router connected to the right-side LAN and the inter-router WAN.

  - **Switches**: connect PCs to their local router; no routing configuration is needed.

  - **PCs**: end devices configured with local IP settings and a default gateway.

  - **WAN/inter-router network**: network connecting the two routers, for example
  using addresses such as **10.0.0.1** and **10.0.0.2**.


  ## 3. Router Configuration Workflow


  Each router is configured in a similar way. The process is symmetrical: what is
  done on Router A must be done analogously on Router B.


  ### Step 1: Open the router configuration


  In the simulator or device interface:


  1. Open the router.

  2. Go to the **Configuration** tab.

  3. Assign a meaningful router name.


  A name helps identify which router belongs to which side of the topology.


  Examples:


  - Router A / Left router / Paloma router

  - Router B / Right router / Balizas router


  The name itself does not affect routing, but it is useful for clarity and troubleshooting.


  ## 4. Interface Configuration


  Each router has at least two relevant interfaces:


  1. **LAN interface**: connects the router to the local switch and local PCs.

  2. **WAN interface**: connects the router to the other router.


  ### Router A example


  Router A may have:


  | Interface role | Example address | Purpose |

  |---|---:|---|

  | LAN interface | 192.168.1.100 or similar | Gateway for LAN A PCs |

  | WAN interface | 10.0.0.1 | Link to Router B |


  ### Router B example


  Router B may have:


  | Interface role | Example address | Purpose |

  |---|---:|---|

  | LAN interface | 192.168.2.200 or similar | Gateway for LAN B PCs |

  | WAN interface | 10.0.0.2 | Link to Router A |


  > The exact IP addresses and subnet masks depend on the addressing plan used in
  the lab. The key rule is that each router interface must belong to the correct network
  segment.


  ### Critical interface requirements


  For every router interface:


  - Assign the correct **IP address**.

  - Assign the correct **subnet mask**.

  - Enable the interface/port.


  A common mistake is configuring the IP address but forgetting to turn on the port.
  If the interface is not enabled, traffic will not pass even if the address is correct.


  ## 5. Routing Configuration


  The lesson refers to configuring networks under a **routing protocol**, describing
  this as **dynamic routing**.


  Dynamic routing allows routers to exchange information about the networks they know.
  Instead of manually entering every remote route, each router advertises its connected
  networks to the other router.


  ### Networks to include


  Each router should advertise the networks directly connected to it:


  - Its local LAN network.

  - The WAN/inter-router network.


  For a two-router, two-LAN topology, the overall networks may be:


  | Network type | Example network | Connected to |

  |---|---:|---|

  | LAN A | 192.168.1.0/24 | Router A LAN side |

  | LAN B | 192.168.2.0/24 | Router B LAN side |

  | WAN | 10.0.0.0/24 or 10.0.0.0/30 | Between Router A and Router B |


  The content mentions adding the local networks and the WAN network into the routing
  configuration.


  ### Logic of dynamic routing


  The routing logic is:


  1. Router A directly knows LAN A and the WAN network.

  2. Router B directly knows LAN B and the WAN network.

  3. Through the routing protocol, Router A learns how to reach LAN B.

  4. Through the routing protocol, Router B learns how to reach LAN A.

  5. Once both routers have routes, hosts on both LANs can exchange packets.


  ## 6. PC Configuration


  Each PC must be configured with:


  - **IP address**: unique address inside its local LAN.

  - **Subnet mask**: defines which addresses are local.

  - **Default gateway**: router LAN interface address.


  ### Default gateway rule


  The default gateway for a PC is always the IP address of the router interface connected
  to that PC''s LAN.


  Example:


  | Device | IP address | Default gateway |

  |---|---:|---:|

  | PC in LAN A | 192.168.1.10 | 192.168.1.100 |

  | PC in LAN B | 192.168.2.10 | 192.168.2.200 |


  The gateway is described in the source as the address that provides the exit to
  the rest of the network.


  ### Why the default gateway matters


  A PC can communicate directly only with devices in its own subnet. When it needs
  to reach another network, it sends the packet to its default gateway.


  For example:


  ```text

  PC A wants to reach PC B.

  PC B is not in PC A''s local subnet.

  PC A sends the packet to Router A''s LAN interface.

  Router A forwards the packet toward Router B.

  Router B forwards the packet to LAN B.

  ```


  Without a correct default gateway, the PC may communicate locally but fail to reach
  remote networks.


  ## 7. Role of the Switch


  The switch is described as needing only physical connection.


  In this scenario, the switch:


  - Connects PCs to the router within the same LAN.

  - Operates at Layer 2 using MAC addresses.

  - Does not need routing configuration.

  - Does not need a default gateway for basic forwarding.


  The switch must simply be connected correctly with the appropriate cables.


  ## 8. Testing Connectivity


  After configuring routers and PCs, connectivity is tested from the command prompt
  or system symbol.


  The typical command is:


  ```text

  ping <destination-ip-address>

  ```


  Example:


  ```text

  ping 192.168.2.10

  ```


  A successful ping indicates that:


  - The source PC has correct IP settings.

  - The source PC has the correct default gateway.

  - Router interfaces are enabled.

  - The routers know how to reach each other''s LANs.

  - The destination PC is correctly addressed and reachable.

  - Return traffic can find its way back.


  ### Testing both directions


  The source emphasizes testing from both sides:


  1. From a PC in LAN A to a PC in LAN B.

  2. From a PC in LAN B to a PC in LAN A.


  This matters because bidirectional communication requires correct routing and gateway
  configuration on both sides.


  ## 9. Troubleshooting Logic


  If ping fails, check the configuration in this order:


  ### 1. Physical connections


  - Are cables connected to the correct interfaces?

  - Are switch and router ports linked?

  - Are interface lights active?


  ### 2. Router interface status


  - Are both router ports enabled?

  - Is the IP address correct?

  - Is the subnet mask correct?


  ### 3. PC addressing


  - Is the PC IP address in the correct subnet?

  - Is the subnet mask correct?

  - Is the default gateway the router''s LAN interface?


  ### 4. Routing configuration


  - Did each router advertise its LAN network?

  - Did each router advertise the WAN network if required by the protocol?

  - Does each router have a route to the remote LAN?


  ### 5. Test local before remote


  A useful test sequence is:


  ```text

  1. Ping PC''s own default gateway.

  2. Ping the remote router''s WAN interface.

  3. Ping the remote router''s LAN interface.

  4. Ping the remote PC.

  ```


  This isolates where communication fails.


  ## 10. Core Conclusion


  The lesson concludes that both networks are interconnected once:


  - Router names are assigned for identification.

  - Router interfaces have correct IP addresses and masks.

  - Router ports are enabled.

  - Dynamic routing is configured with the appropriate networks.

  - PCs have correct local IP configuration.

  - Each PC uses the local router interface as its default gateway.

  - Ping tests succeed in both directions.


  The important conceptual point is that inter-network communication depends on both
  **end-host gateway configuration** and **router-to-router route knowledge**.'
key_concepts:
- 'Local Area Network: A group of devices sharing the same local IP subnet and normally
  connected through a switch.'
- 'Router: A Layer 3 device that forwards packets between different IP networks.'
- 'Switch: A Layer 2 device that connects devices within the same LAN and forwards
  frames based on MAC addresses.'
- 'Interface: A physical or logical router port that must have an IP address, subnet
  mask, and enabled status to carry traffic.'
- 'IP Address: A numerical identifier assigned to a device interface so it can send
  and receive packets on an IP network.'
- 'Subnet Mask: A value that determines which part of an IP address identifies the
  network and which part identifies the host.'
- 'Default Gateway: The router interface address that a host uses to send traffic
  outside its local subnet.'
- 'WAN Link: The network segment connecting two routers, commonly using addresses
  such as 10.0.0.1 and 10.0.0.2 in a lab.'
- 'Dynamic Routing: A method where routers exchange route information automatically
  using a routing protocol.'
- 'Advertised Network: A directly connected network that a router announces to other
  routers through a dynamic routing protocol.'
- 'Routing Table: The router''s list of known networks and the next hop or interface
  used to reach them.'
- 'Ping: A diagnostic command that sends ICMP echo requests to verify reachability
  between devices.'
- 'Bidirectional Connectivity: The condition where traffic can travel successfully
  from one side to the other and return.'
- 'Interface Activation: The act of enabling a router port so it changes from administratively
  down to operational.'
- 'End-to-End Testing: Verifying communication from one final host to another, not
  merely between routers.'
