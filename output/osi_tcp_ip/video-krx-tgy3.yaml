summary: 'La clase introduce la Unidad 3 de redes informáticas, centrada en comprender
  el modelo TCP/IP mediante su comparación con el modelo OSI, el estudio capa por
  capa de sus funciones, el análisis de cabeceras de protocolos y la práctica con
  capturas de tráfico. La tesis central es que para interpretar correctamente una
  comunicación de red no basta con observar la aplicación visible para el usuario;
  es necesario entender cómo los datos se encapsulan, direccionan, transportan y desencapsulan
  a través de sucesivas capas, cada una con protocolos, identificadores y responsabilidades
  propias.


  La metodología propuesta combina explicación conceptual, comparación de modelos,
  análisis de estructuras de paquetes y práctica con herramientas. Primero se repasa
  el modelo OSI de siete capas: física, enlace, red, transporte, sesión, presentación
  y aplicación. Luego se lo compara con el modelo TCP/IP, que agrupa funciones en
  menos capas: acceso a red o enlace, internet, transporte y aplicación. Esta comparación
  permite ver que TCP/IP no contradice al modelo OSI, sino que reorganiza sus funciones
  de forma más práctica para redes reales.


  El razonamiento avanza desde lo visible hacia lo interno: una comunicación que el
  usuario percibe como una página web, un correo o un archivo se divide en segmentos,
  recibe cabeceras TCP o UDP, se encapsula en paquetes IP, se convierte en tramas
  con direcciones MAC y finalmente viaja como bits por el medio físico. En destino
  ocurre el proceso inverso, verificando direcciones, puertos, números de secuencia
  y reconocimientos según corresponda.


  La conclusión práctica es que el estudiante debe aprender a interpretar cabeceras,
  puertos, direcciones IP, direcciones MAC y capas de encapsulación mediante capturas
  reales, especialmente con Wireshark. Esto permitirá diagnosticar comunicaciones,
  reconocer protocolos como HTTP, HTTPS, FTP, SMTP, TCP, UDP, IPv4 e IPv6, y comprender
  cómo se construye y analiza el tráfico de red en escenarios reales.'
detailed_notes: '## 1. Propósito de la unidad


  La unidad tiene como objetivo que el estudiante pueda **interpretar y estudiar el
  modelo TCP/IP**, compararlo con el **modelo OSI**, comprender sus capas y practicar
  el análisis de comunicaciones reales mediante capturas de tráfico.


  ### Objetivos principales


  - Repasar el **modelo OSI** y sus siete capas.

  - Comparar OSI con el **modelo TCP/IP**.

  - Estudiar cómo se encapsulan los datos en una comunicación de red.

  - Reconocer **cabeceras** de protocolos como TCP, UDP, IP e IPv6.

  - Identificar protocolos comunes y sus **puertos bien conocidos**.

  - Practicar con herramientas como **Wireshark** y escenarios de red descargables.

  - Aprender a leer una captura de red capa por capa.


  ---


  ## 2. Modelo OSI: estructura general


  El **modelo OSI** divide el proceso de comunicación entre equipos en **siete capas**.
  Cada capa representa un conjunto de funciones específicas necesarias para que los
  datos puedan viajar desde una aplicación origen hasta una aplicación destino.


  ### Las siete capas del modelo OSI


  | Capa | Nombre | Función principal | Ejemplos o elementos asociados |

  |---|---|---|---|

  | 7 | Aplicación | Protocolos utilizados directamente por aplicaciones | HTTP, HTTPS,
  SMTP, FTP, DNS |

  | 6 | Presentación | Formato, codificación y representación de datos | JPG, TXT,
  cifrado, compresión |

  | 5 | Sesión | Administración de sesiones entre procesos | Sockets, control de diálogo
  |

  | 4 | Transporte | Comunicación extremo a extremo entre procesos | TCP, UDP, puertos
  |

  | 3 | Red | Direccionamiento lógico y enrutamiento | IP, protocolos de control y
  enrutamiento |

  | 2 | Enlace de datos | Direccionamiento físico local y tramas | MAC, Ethernet,
  Wi-Fi, VLAN |

  | 1 | Física | Transmisión de bits por el medio | Cables, señales eléctricas, radiofrecuencia
  |


  ### Idea esencial del modelo OSI


  Cada capa resuelve un problema concreto:


  - La **capa física** transmite bits.

  - La **capa de enlace** permite la comunicación dentro de una red local usando direcciones
  MAC.

  - La **capa de red** permite llegar a redes remotas usando direcciones IP.

  - La **capa de transporte** permite que dos procesos se comuniquen usando puertos.

  - Las capas superiores gestionan sesiones, formatos y protocolos de aplicación.


  ---


  ## 3. Modelo TCP/IP y comparación con OSI


  El modelo TCP/IP es el modelo práctico usado en Internet y en la mayoría de redes
  actuales. Tiene menos capas que OSI porque agrupa funciones.


  ### Capas del modelo TCP/IP


  | Modelo TCP/IP | Capas OSI relacionadas | Función |

  |---|---|---|

  | Acceso a red o enlace | OSI 1 y 2 | Transmisión física y enlace local |

  | Internet | OSI 3 | Direccionamiento IP y enrutamiento |

  | Transporte | OSI 4 | Comunicación extremo a extremo con TCP o UDP |

  | Aplicación | OSI 5, 6 y 7 | Sesión, presentación y protocolos de aplicación |


  ### Observaciones importantes


  - En TCP/IP, las capas **física y enlace** de OSI suelen agruparse en una sola capa
  llamada **acceso a red** o **enlace**.

  - La capa **Internet** de TCP/IP equivale aproximadamente a la capa **Red** de OSI.

  - La capa **Transporte** existe en ambos modelos con funciones similares.

  - La capa **Aplicación** de TCP/IP reúne las funciones de las capas OSI de **sesión,
  presentación y aplicación**.


  ---


  ## 4. Protocolos asociados por capa


  ### Capa de acceso a red o enlace


  Incluye normas físicas y de enlace, por ejemplo:


  - **Ethernet / IEEE 802.3**: redes cableadas LAN.

  - **Wi-Fi / IEEE 802.11**: redes inalámbricas.

  - **VLAN / IEEE 802.1Q**: etiquetado de redes virtuales.

  - **PPP**: protocolo punto a punto.

  - **MPLS**: conmutación por etiquetas, usada en redes de proveedores.

  - **Direcciones MAC**: identificadores físicos de interfaces de red.


  ### Capa de Internet


  Incluye protocolos relacionados con direccionamiento lógico y enrutamiento:


  - **IPv4**: protocolo IP clásico, direcciones de 32 bits.

  - **IPv6**: versión moderna de IP, direcciones de 128 bits.

  - **ICMP**: mensajes de control y diagnóstico, como ping.

  - Protocolos de enrutamiento: utilizados por routers para decidir caminos.


  ### Capa de transporte


  Protocolos principales:


  - **TCP**: orientado a conexión, confiable, usa números de secuencia y reconocimientos.

  - **UDP**: no orientado a conexión, más simple, sin control de entrega ni recuperación
  de errores a nivel de transporte.


  ### Capa de aplicación


  Protocolos utilizados por programas y servicios:


  - **HTTP**: navegación web sin cifrado, puerto 80.

  - **HTTPS**: navegación web segura, puerto 443.

  - **FTP**: transferencia de archivos, puertos 20 y 21.

  - **SMTP**: envío de correos electrónicos, puerto 25.

  - Otros protocolos pueden incluir DNS, SSH, Telnet, POP3 e IMAP.


  ---


  ## 5. Comunicación entre capas


  Una idea clave es que cada capa se comunica lógicamente con su capa equivalente
  en el equipo remoto.


  ### Comunicación horizontal y vertical


  - **Comunicación vertical**: los datos bajan por las capas del equipo origen y suben
  por las capas del equipo destino.

  - **Comunicación horizontal o lógica**: la capa de transporte del origen parece
  comunicarse con la capa de transporte del destino, la capa de red con la capa de
  red, etc.


  ### Ejemplo conceptual


  Cuando una aplicación envía datos:


  1. La aplicación genera datos.

  2. Transporte agrega una cabecera TCP o UDP.

  3. Internet agrega una cabecera IP.

  4. Enlace agrega una cabecera de trama con direcciones MAC.

  5. Física transmite bits.


  En destino:


  1. Física recibe bits.

  2. Enlace interpreta la trama y revisa la MAC destino.

  3. Internet revisa la IP destino.

  4. Transporte revisa puertos y controles TCP/UDP.

  5. Aplicación recibe los datos finales.


  ---


  ## 6. Encapsulación de datos


  La **encapsulación** es el proceso por el cual cada capa agrega su propia información
  de control, llamada **cabecera**, a los datos recibidos de la capa superior.


  ### Flujo de encapsulación


  ```text

  Datos de aplicación

  → Segmento TCP o datagrama UDP

  → Paquete IP

  → Trama Ethernet/Wi-Fi

  → Bits en el medio físico

  ```


  ### Unidades de datos por capa


  | Capa | Unidad de datos | Información agregada |

  |---|---|---|

  | Aplicación | Datos | Información del protocolo de aplicación |

  | Transporte | Segmento TCP o datagrama UDP | Puertos, secuencia, reconocimiento,
  longitud |

  | Internet | Paquete IP | IP origen, IP destino, versión, controles |

  | Enlace | Trama | MAC origen, MAC destino, tipo, FCS |

  | Física | Bits | Señales eléctricas, ópticas o radioeléctricas |


  ### Proceso descrito en la clase


  El docente explica que lo que el usuario ve es únicamente la aplicación: Facebook,
  navegador, correo, intercambio de archivos, etc. Pero internamente ocurre lo siguiente:


  - El mensaje se divide en **segmentos de datos**.

  - A cada segmento se le agrega una **cabecera TCP** si se usa TCP.

  - Luego se agrega una **cabecera IP**, formando un paquete.

  - Después se arma una **trama** con direcciones MAC de origen y destino.

  - Finalmente la información viaja como **bits** por el medio.


  ---


  ## 7. Desencapsulación en destino


  La **desencapsulación** es el proceso inverso a la encapsulación. El equipo receptor
  analiza cada capa y elimina la cabecera correspondiente.


  ### Proceso general


  1. La tarjeta de red recibe bits.

  2. La capa de enlace reconstruye la trama.

  3. Se verifica si la **MAC destino** coincide con la interfaz receptora.

  4. Si coincide, se extrae el paquete IP.

  5. La capa de red verifica la **IP destino**.

  6. Si corresponde, se entrega el segmento o datagrama a transporte.

  7. La capa de transporte analiza el puerto destino.

  8. El protocolo entrega los datos a la aplicación correspondiente.


  ### Criterio de aceptación


  Un equipo acepta una trama o paquete cuando los identificadores coinciden con él:


  - En capa 2: coincide la **MAC destino**.

  - En capa 3: coincide la **IP destino**.

  - En capa 4: coincide el **puerto destino** con un servicio o aplicación activa.


  ---


  ## 8. TCP frente a UDP


  ### UDP


  UDP es un protocolo de transporte simple. Su cabecera contiene poca información.


  Campos principales mencionados:


  - **Puerto origen**.

  - **Puerto destino**.

  - **Longitud del datagrama**.

  - Datos.


  Características:


  - No establece conexión previa.

  - No garantiza entrega.

  - No controla orden de llegada.

  - No retransmite automáticamente.

  - Tiene menor sobrecarga que TCP.


  ### TCP


  TCP ofrece transporte confiable.


  Campos principales mencionados:


  - **Puerto origen**.

  - **Puerto destino**.

  - **Número de secuencia**.

  - **Número de reconocimiento**.

  - Controles adicionales.

  - Datos.


  Características:


  - Usa conexión lógica entre extremos.

  - Numera los datos enviados.

  - Confirma datos recibidos mediante reconocimientos.

  - Permite detectar pérdidas.

  - Puede retransmitir segmentos perdidos.

  - Es apropiado para navegación web, transferencia de archivos, correo y otros servicios
  que requieren confiabilidad.


  ### Número de secuencia y reconocimiento


  El docente destaca que TCP usa:


  - **Número de secuencia**: número asignado por quien envía para identificar la posición
  de los datos transmitidos.

  - **Número de reconocimiento**: respuesta del receptor indicando qué datos recibió
  correctamente y qué espera a continuación.


  Esto permite que TCP controle pérdidas y ordene correctamente la comunicación.


  ---


  ## 9. Cabeceras IP e IPv6


  ### Cabecera IP


  La cabecera IP permite identificar el origen y destino lógico del paquete.


  Campos conceptuales principales:


  - **IP origen**.

  - **IP destino**.

  - Versión del protocolo.

  - Longitud.

  - Controles para el manejo del paquete.

  - Información necesaria para enrutamiento.


  ### IPv4 e IPv6


  - **IPv4** usa direcciones de 32 bits, por ejemplo 192.168.1.10.

  - **IPv6** usa direcciones de 128 bits, por ejemplo 2001:db8::1.

  - IPv6 tiene direcciones más largas y más capacidad de direccionamiento.

  - Aunque la cabecera de IPv6 cambia respecto de IPv4, mantiene la idea fundamental:
  identificar origen, destino y parámetros necesarios para transportar el paquete.


  ---


  ## 10. Puertos y servicios


  Los puertos permiten que varios servicios o aplicaciones compartan una misma dirección
  IP.


  ### Rango de puertos


  Los puertos se codifican con **16 bits**.


  Cantidad total posible:


  ```text

  2^16 = 65.536 valores

  Rango numérico: 0 a 65.535

  ```


  ### Puertos bien conocidos


  Los puertos del **0 al 1023** son considerados puertos bien conocidos y suelen estar
  asignados a servicios estándar.


  Ejemplos mencionados:


  | Servicio | Protocolo | Puerto típico |

  |---|---|---|

  | HTTP | TCP | 80 |

  | HTTPS | TCP | 443 |

  | FTP control | TCP | 21 |

  | FTP datos | TCP | 20 |

  | Telnet | TCP | 23 |

  | SMTP | TCP | 25 |


  ### Relación entre IP, puerto y socket


  Un **socket** puede entenderse como la combinación entre:


  - Dirección IP.

  - Puerto.

  - Protocolo de transporte.


  Ejemplo conceptual:


  ```text

  192.168.1.20:443/TCP

  ```


  Esto identifica una comunicación hacia el servicio HTTPS de un equipo específico.


  ---


  ## 11. Lectura de capturas con Wireshark


  La práctica propuesta incluye instalar y usar **Wireshark**, un analizador de protocolos
  de red.


  ### Qué permite hacer Wireshark


  - Capturar tráfico desde la interfaz de red del equipo.

  - Ver los paquetes organizados por capas.

  - Expandir cabeceras haciendo clic en los símbolos de despliegue.

  - Analizar direcciones MAC, direcciones IP, puertos, números de secuencia y reconocimientos.

  - Relacionar teoría de encapsulación con tráfico real.


  ### Qué observar en una captura


  En una captura típica se puede analizar:


  1. **Capa física o información de captura**: bits o detalles de frame capturado.

  2. **Capa de enlace**: MAC origen y MAC destino.

  3. **Capa de red**: IP origen e IP destino.

  4. **Capa de transporte**: protocolo TCP o UDP, puertos, secuencia, ACK.

  5. **Capa de aplicación**: HTTP, DNS, TLS, SMTP u otro protocolo visible.


  ### Objetivo de la práctica


  El objetivo no es solo capturar paquetes, sino aprender a interpretar las cabeceras
  para que, en situaciones reales, el estudiante pueda diagnosticar problemas y reconocer
  qué está ocurriendo en una comunicación.


  ---


  ## 12. Herramientas y prácticas sugeridas


  La clase menciona materiales descargables:


  - Un escenario de práctica de red.

  - Un paquete relacionado con Packet Tracer o laboratorio de red.

  - Un manual para ejecutar comandos de red.

  - Wireshark para capturas reales.


  ### Actividades esperadas


  - Descargar los archivos indicados por el docente.

  - Abrir los escenarios de práctica.

  - Ejecutar comandos de red.

  - Capturar tráfico con Wireshark.

  - Responder preguntas de análisis.

  - Usar foros para resolver dudas.


  ---


  ## 13. Ideas esenciales para dominar la unidad


  - El modelo OSI ayuda a **organizar conceptualmente** las funciones de red.

  - El modelo TCP/IP es el modelo **práctico** de Internet.

  - Los datos no viajan solos: cada capa agrega información mediante **cabeceras**.

  - TCP agrega confiabilidad mediante **secuencia** y **reconocimiento**.

  - UDP prioriza simplicidad y velocidad, pero no garantiza entrega.

  - Las direcciones **MAC** identifican equipos en una red local.

  - Las direcciones **IP** identifican origen y destino lógico entre redes.

  - Los **puertos** identifican aplicaciones o servicios dentro de un host.

  - Wireshark permite ver en la práctica lo que ocurre dentro de cada comunicación.'
key_concepts:
- 'Modelo OSI: marco conceptual de siete capas que separa las funciones necesarias
  para comunicar sistemas en una red.'
- 'Modelo TCP/IP: arquitectura práctica de Internet que agrupa las funciones de red
  en capas de acceso, internet, transporte y aplicación.'
- 'Capa física: nivel encargado de convertir datos en señales y transmitir bits por
  un medio cableado, óptico o inalámbrico.'
- 'Capa de enlace: nivel que organiza bits en tramas y usa direcciones MAC para la
  comunicación dentro de una red local.'
- 'Capa de red o internet: nivel que usa direcciones IP para transportar paquetes
  entre redes y permitir el enrutamiento.'
- 'Capa de transporte: nivel que permite la comunicación entre procesos mediante TCP
  o UDP y números de puerto.'
- 'Capa de aplicación: nivel donde operan protocolos usados directamente por programas,
  como HTTP, HTTPS, FTP y SMTP.'
- 'Encapsulación: proceso por el cual cada capa agrega una cabecera propia a los datos
  recibidos de la capa superior.'
- 'Desencapsulación: proceso inverso en el receptor, donde cada capa interpreta y
  elimina su cabecera antes de entregar los datos a la capa superior.'
- 'Cabecera de protocolo: bloque de información de control agregado a los datos para
  indicar origen, destino, longitud, puertos, secuencia u otros parámetros.'
- 'Dirección MAC: identificador físico de una interfaz de red usado principalmente
  en la capa de enlace dentro de una LAN.'
- 'Dirección IP: identificador lógico de un host o interfaz en una red IP, usado para
  enrutar paquetes.'
- 'Puerto: número de 16 bits que identifica una aplicación o servicio dentro de un
  equipo en la capa de transporte.'
- 'TCP confiable: mecanismo de transporte que usa conexión, números de secuencia y
  reconocimientos para controlar entrega y orden.'
- 'Análisis de paquetes: práctica de inspeccionar tramas, paquetes y segmentos con
  herramientas como Wireshark para comprender o diagnosticar comunicaciones.'
glossary:
- term: OSI
  definition: Modelo de referencia de siete capas usado para describir de forma ordenada
    las funciones de comunicación en redes.
  related_terms:
  - TCP/IP
  - capa
  - encapsulación
- term: TCP/IP
  definition: Familia de protocolos y modelo de arquitectura de red usado por Internet,
    organizado comúnmente en capas de acceso, internet, transporte y aplicación.
  related_terms:
  - IP
  - TCP
  - UDP
  - Internet
- term: Capa
  definition: Nivel funcional de un modelo de red que agrupa tareas específicas y
    se comunica con capas adyacentes en el mismo equipo y con su capa equivalente
    en el equipo remoto.
  related_terms:
  - OSI
  - TCP/IP
  - PDU
- term: Capa física
  definition: Capa que transmite bits mediante señales eléctricas, ópticas o radioeléctricas
    a través del medio de comunicación.
  related_terms:
  - bits
  - medio físico
  - Ethernet
- term: Capa de enlace
  definition: Capa que forma tramas, usa direcciones MAC y permite la comunicación
    directa entre dispositivos de una misma red local.
  related_terms:
  - MAC
  - trama
  - Ethernet
  - Wi-Fi
- term: Capa de red
  definition: Capa del modelo OSI encargada del direccionamiento lógico y del enrutamiento
    de paquetes entre redes.
  related_terms:
  - IP
  - router
  - paquete
- term: Capa de internet
  definition: Nombre de la capa TCP/IP equivalente a la capa de red de OSI, centrada
    en IP y en el transporte de paquetes entre redes.
  related_terms:
  - IPv4
  - IPv6
  - enrutamiento
- term: Capa de transporte
  definition: Capa que proporciona comunicación extremo a extremo entre aplicaciones
    mediante protocolos como TCP y UDP.
  related_terms:
  - TCP
  - UDP
  - puerto
  - segmento
- term: Capa de aplicación
  definition: Capa donde operan los protocolos usados por programas y servicios, como
