  related_terms:
  - HTTP
  - HTTPS
  - SMTP
  - FTP
- term: Encapsulación
  definition: Proceso de agregar cabeceras de distintas capas a los datos a medida
    que bajan por la pila de red antes de transmitirse.
  related_terms:
  - cabecera
  - segmento
  - paquete
  - trama
- term: Desencapsulación
  definition: Proceso por el cual el receptor interpreta y retira cabeceras capa por
