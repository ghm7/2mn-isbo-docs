quiz_questions:
- question: En el modelo OSI, la capa 6 se encarga de los formatos de representación
    de los datos, por ejemplo si un archivo es JPG o TXT. Esta capa se llama capa
    de ________.
  answer: presentación
  explanation: La capa 6 del modelo OSI es la capa de presentación. Su función es
    ocuparse de cómo se representan o codifican los datos para que puedan ser interpretados
    correctamente, por ejemplo formatos como JPG, TXT u otros tipos de archivo.
  difficulty: easy
  type: fill_blank
- question: ¿Cuál de las siguientes opciones describe mejor la relación entre el modelo
    OSI y el modelo TCP/IP según el estudio comparativo presentado?
  answer: B. En TCP/IP, las capas superiores de OSI —sesión, presentación y aplicación—
    se agrupan en una capa de aplicación; la capa de red de OSI se corresponde con
    la capa de Internet; y la capa de transporte cumple funciones equivalentes en
    ambos modelos.
  explanation: El modelo OSI divide la comunicación en siete capas, mientras que TCP/IP
    agrupa algunas de ellas. En particular, las capas 5, 6 y 7 de OSI se reúnen en
    la capa de aplicación de TCP/IP. Además, la capa de red de OSI se relaciona con
    la capa de Internet de TCP/IP, donde se ubica IP, y la capa de transporte mantiene
    funciones similares en ambos modelos, con protocolos como TCP y UDP.
  difficulty: medium
  type: multiple_choice
  options:
  - A. El modelo TCP/IP mantiene separadas las capas de sesión, presentación y aplicación
    exactamente igual que el modelo OSI.
  - B. En TCP/IP, las capas superiores de OSI —sesión, presentación y aplicación—
    se agrupan en una capa de aplicación; la capa de red de OSI se corresponde con
    la capa de Internet; y la capa de transporte cumple funciones equivalentes en
    ambos modelos.
  - C. La capa física de OSI se corresponde con la capa de aplicación de TCP/IP porque
    ambas se encargan de transmitir datos al usuario final.
  - D. En TCP/IP, el protocolo IP pertenece a la capa de transporte, mientras que
    TCP y UDP pertenecen a la capa de Internet.
- question: Compara la capa de red del modelo OSI con la capa de Internet del modelo
    TCP/IP, y luego compara la capa de transporte en ambos modelos. ¿Qué semejanzas
    y diferencias principales aparecen?
  answer: 'La capa de red de OSI y la capa de Internet de TCP/IP cumplen funciones
    equivalentes: permiten el direccionamiento lógico y el encaminamiento de paquetes,
    principalmente mediante IP. En cambio, la capa de transporte existe con el mismo
    nombre y con tareas muy similares en ambos modelos, encargándose de la comunicación
    extremo a extremo mediante protocolos como TCP y UDP.'
  explanation: 'La comparación exige distinguir entre equivalencia funcional y coincidencia
    directa. OSI llama ''capa de red'' a la capa donde opera IP, mientras que TCP/IP
    la denomina ''capa de Internet''. En transporte, la correspondencia es más directa:
    ambos modelos reconocen una capa dedicada a administrar la comunicación entre
    procesos o aplicaciones, usando puertos y protocolos como TCP o UDP.'
  difficulty: medium
  type: comparison
- question: 'Durante una práctica de captura de tráfico, una estudiante observa lo
    siguiente en Wireshark: una trama Ethernet con direcciones MAC de origen y destino;
    dentro de ella, un paquete IPv4 con direcciones IP de origen y destino; dentro
    del paquete, un segmento TCP con puerto de origen 51544 y puerto de destino 80;
    finalmente, los datos corresponden a una imagen JPG descargada desde una página
    web. ¿Cuál es la interpretación más correcta capa por capa?'
  answer: B. Las direcciones MAC pertenecen a la capa de enlace; las direcciones IP
    a la capa de red o Internet; los puertos TCP a la capa de transporte; y el formato
    JPG se relaciona con la presentación de los datos, agrupada dentro de la capa
    de aplicación en TCP/IP.
  explanation: La opción correcta interpreta la captura siguiendo la encapsulación
    por capas. Ethernet y las direcciones MAC corresponden a la capa de enlace; IP
    trabaja en la capa de red del modelo OSI o capa de Internet en TCP/IP; TCP y sus
    puertos pertenecen a la capa de transporte. El hecho de que los datos sean una
    imagen JPG se relaciona con la forma en que se representan los datos, función
    asociada a la capa de presentación en OSI, aunque en TCP/IP esas funciones superiores
    se agrupan dentro de la capa de aplicación.
  difficulty: hard
  type: scenario
  options:
  - A. Todo corresponde a la capa de aplicación, porque el tráfico fue generado por
    un navegador web.
  - B. Las direcciones MAC pertenecen a la capa de enlace; las direcciones IP a la
    capa de red o Internet; los puertos TCP a la capa de transporte; y el formato
    JPG se relaciona con la presentación de los datos, agrupada dentro de la capa
    de aplicación en TCP/IP.
  - C. Las direcciones IP pertenecen a la capa física, los puertos TCP a la capa de
    red y el formato JPG a la capa de transporte.
  - D. Las direcciones MAC identifican sockets, mientras que las direcciones IP indican
    el formato del archivo transmitido.
flashcards:
- front: What is the OSI model used for in networking?
  back: The OSI model organizes network communication into seven layers, each responsible
    for specific tasks needed to communicate between two devices.
  tags:
  - networking
  - osi
  - definition
- front: How does the TCP/IP model group OSI layers 1 and 2?
  back: In the TCP/IP model, OSI layers 1 and 2 are grouped into the network access/link
    layer, which includes physical and data link technologies.
  tags:
  - tcp-ip
  - osi
  - comparison
- front: What is a socket in the context of OSI layer 5?
  back: A socket is an operating-system-level identifier for a connection, formed
    by the combination of an IP address and a port.
  tags:
  - sockets
  - session-layer
  - definition
- front: Why is the OSI presentation layer important?
  back: The presentation layer handles data formats, such as whether a file is represented
    as JPG, TXT, or another format.
  tags:
  - osi
  - presentation-layer
  - why
- front: If you are analyzing Ethernet 802.3 or Wi-Fi 802.11, which OSI area are you
    mainly studying?
  back: You are mainly studying the lower OSI layers, especially the physical and
    data link layers.
  tags:
  - ethernet
  - wifi
  - application
practice_exercises:
- title: Analizar una captura de red y relacionarla con los modelos OSI y TCP/IP
  description: 'Realiza una práctica de captura y análisis de tráfico de red usando
    Wireshark. El objetivo es observar cómo una comunicación real se encapsula en
    capas, identificar cabeceras y relacionarlas con los modelos OSI y TCP/IP. Para
    ello, abre Wireshark, inicia una captura en la interfaz de red activa y genera
    tráfico visitando un sitio web seguro, por ejemplo https://example.com o cualquier
    sitio HTTPS. Luego detén la captura y selecciona al menos un paquete TCP relacionado
    con esa conexión. Entrega un informe breve que incluya: 1) una tabla que indique
    qué información encontraste en la capa de enlace, capa de red, capa de transporte
    y capa de aplicación; 2) las direcciones MAC origen y destino; 3) las direcciones
    IP origen y destino; 4) los puertos origen y destino; 5) el protocolo de transporte
    utilizado; 6) una explicación de por qué el puerto 443 indica tráfico HTTPS; 7)
    una descripción del proceso de encapsulación desde datos de aplicación hasta bits
    en la red; 8) una comparación entre cómo ubicarías ese mismo paquete en el modelo
    OSI y en el modelo TCP/IP. Puedes incluir capturas de pantalla de Wireshark como
    evidencia.'
  difficulty: medium
  type: analysis
  hints:
  - 'Hint 1: En Wireshark puedes usar filtros como tcp, tls, http, ip.addr == TU_IP
    o tcp.port == 443 para reducir la cantidad de paquetes visibles.'
  - 'Hint 2: Expande las secciones Ethernet II, Internet Protocol, Transmission Control
    Protocol y, si aparece, TLS para ver las cabeceras por capa.'
  - 'Hint 3: Recuerda que en el modelo TCP/IP las capas de aplicación, presentación
    y sesión del modelo OSI suelen agruparse dentro de una sola capa de aplicación.'
  solution: 'Una solución correcta debe identificar y explicar los datos principales
    observados en la captura. Puntos clave esperados: En la capa de enlace debe aparecer
    una trama Ethernet con dirección MAC origen y MAC destino; estas direcciones corresponden
    al equipo local y al siguiente salto de la red, normalmente el router o gateway,
    no necesariamente al servidor final. En la capa de red debe aparecer IPv4 o IPv6
    con IP origen e IP destino; por ejemplo, la IP privada del equipo como origen
    y la IP pública del servidor web como destino en paquetes salientes. En la capa
    de transporte debe aparecer TCP, con puerto origen dinámico o efímero, por ejemplo
    51524, y puerto destino 443 para HTTPS. Deben observarse campos como número de
    secuencia, número de acuse de recibo o acknowledgment, flags TCP y longitud. En
    la capa de aplicación puede aparecer TLS si el sitio usa HTTPS; el contenido de
    la aplicación normalmente no será legible porque está cifrado. La explicación
    del puerto 443 debe indicar que es el puerto bien conocido estándar para HTTPS,
    mientras que HTTP sin cifrado usa normalmente el puerto 80. La comparación con
    OSI debe ubicar Ethernet en capas 1-2, IP en capa 3, TCP en capa 4 y TLS/HTTPS
    en capas superiores, especialmente capa 7 para aplicación. En TCP/IP, Ethernet
    corresponde a acceso a red, IP a internet, TCP a transporte y HTTPS/TLS a aplicación.
    La descripción de encapsulación debe mencionar que los datos de aplicación se
    segmentan, TCP agrega su cabecera formando segmentos, IP agrega su cabecera formando
    paquetes, Ethernet agrega cabecera y tráiler formando tramas, y finalmente la
    información viaja como bits por el medio físico.'
