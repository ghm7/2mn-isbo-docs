- term: Puertos bien conocidos
  definition: Rango de puertos del 0 al 1023 reservado habitualmente para servicios
    estándar como HTTP, HTTPS, FTP, Telnet y SMTP.
  related_terms:
  - HTTP
  - HTTPS
  - FTP
  - SMTP
- term: Wireshark
  definition: Analizador de protocolos que permite capturar y examinar tráfico de
    red mostrando cabeceras y campos de cada capa.
  related_terms:
  - captura de paquetes
  - cabecera
  - análisis de red
timeline: []
cheat_sheet: '## Redes: OSI, TCP/IP, encapsulación y capturas


  ### Modelos por capas


  | OSI | TCP/IP | Unidad | Identificadores | Ejemplos |

  |---|---|---|---|---|

  | 7 Aplicación | Aplicación | Datos | Protocolo app | HTTP, HTTPS, FTP, SMTP |

  | 6 Presentación | Aplicación | Datos | Formato | JPG, TXT, cifrado |

  | 5 Sesión | Aplicación | Datos | Socket/sesión | Sesiones del SO |

  | 4 Transporte | Transporte | Segmento/datagrama | Puertos | TCP, UDP |

  | 3 Red | Internet | Paquete | IP origen/destino | IPv4, IPv6, ICMP |

  | 2 Enlace | Acceso a red | Trama | MAC origen/destino | Ethernet, Wi-Fi, VLAN |

  | 1 Física | Acceso a red | Bits | Señales | Cable, radio, fibra |


  ### Encapsulación


  ```text

  Aplicación: Datos

  Transporte: [TCP/UDP header][Datos]

  Internet:   [IP header][TCP/UDP][Datos]

  Enlace:     [MAC header][IP][TCP/UDP][Datos][FCS]

  Física:     bits por el medio

  ```


  ### TCP vs UDP


  | Característica | TCP | UDP |

  |---|---|---|

  | Conexión | Sí | No |

  | Confiabilidad | Sí | No garantizada |

  | Orden | Controlado | No garantizado |

  | Campos clave | Puertos, secuencia, ACK, flags | Puertos, longitud, checksum |

  | Uso típico | Web, correo, archivos | DNS, streaming, voz, juegos |


  ### Puertos clave


  | Servicio | Puerto |

  |---|---:|

  | HTTP | 80/TCP |

  | HTTPS | 443/TCP |

  | FTP datos | 20/TCP |

  | FTP control | 21/TCP |

  | Telnet | 23/TCP |

  | SMTP | 25/TCP |


  ```text

  Puertos = 16 bits = 0-65535

  Bien conocidos = 0-1023

  Socket = IP + puerto + protocolo

  Ejemplo = 192.168.1.10:443/TCP

  ```


  ### Qué mirar en Wireshark


  1. Frame: tamaño y datos de captura.

  2. Ethernet/Wi-Fi: MAC origen y destino.

  3. IP: IP origen, IP destino, versión IPv4/IPv6.

  4. TCP/UDP: puertos, secuencia, ACK, longitud.

  5. Aplicación: HTTP, DNS, TLS, SMTP, etc.


  ### Regla mental


  - **MAC** mueve tramas dentro de la red local.

  - **IP** mueve paquetes entre redes.

  - **Puerto** entrega datos a la aplicación correcta.

  - **TCP** controla entrega; **UDP** solo envía datagramas.'
takeaways:
- Dibuja la equivalencia entre las siete capas OSI y las cuatro capas TCP/IP hasta
  poder explicarla sin mirar apuntes.
- Captura tráfico con Wireshark mientras navegas a un sitio HTTP o HTTPS e identifica
  MAC, IP, protocolo de transporte y puerto destino.
- Compara una comunicación TCP y una UDP observando sus cabeceras y anotando qué campos
  existen en una y no en la otra.
- 'Memoriza los puertos bien conocidos más frecuentes: 20, 21, 23, 25, 80 y 443, y
  asócialos con sus servicios.'
- Practica el proceso de encapsulación escribiendo cómo un dato de aplicación se convierte
  en segmento, paquete, trama y bits.
- Analiza una captura real y sigue un paquete desde la capa de enlace hasta la capa
  de aplicación, expandiendo cada cabecera.
- 'Relaciona cada identificador con su capa: MAC en enlace, IP en red/internet y puerto
  en transporte.'
- Usa comandos básicos de red como ping, ipconfig/ifconfig, netstat y traceroute/tracert
  para generar tráfico observable.
- 'Formula preguntas de diagnóstico ante fallas: si no responde, ¿el problema está
  en MAC/enlace, IP/ruta, puerto/transporte o aplicación?'
learning_path:
  prerequisites:
  - 'Conocimientos básicos de informática: sistema operativo, archivos, aplicaciones
    y terminal o consola.'
  - Comprensión elemental de qué es una red LAN y qué es Internet.
  - Nociones básicas de binario y números, especialmente la idea de bits y bytes.
  - Familiaridad mínima con direcciones IP domésticas, routers y conexión Wi-Fi o
    Ethernet.
  - Capacidad para instalar software y ejecutar comandos simples en Windows, Linux
    o macOS.
  next_steps:
  - 'Estudiar direccionamiento IPv4: máscaras, subredes, gateway, CIDR y cálculo de
    redes.'
  - 'Profundizar en TCP: three-way handshake, flags, ventana, retransmisiones y control
    de congestión.'
  - 'Aprender IPv6: estructura de direcciones, tipos de direcciones, SLAAC, Neighbor
    Discovery e ICMPv6.'
  - 'Estudiar Ethernet y switching: ARP, tablas MAC, VLAN 802.1Q y dominios de broadcast.'
  - 'Practicar enrutamiento básico: rutas estáticas, default gateway, OSPF y funcionamiento
    de routers.'
  - 'Aprender análisis avanzado con Wireshark: filtros de captura, filtros de visualización,
    seguimiento de flujos TCP y análisis TLS/DNS.'
  - 'Explorar seguridad de red básica: escaneo de puertos, firewalls, NAT, ataques
    comunes y buenas prácticas.'
