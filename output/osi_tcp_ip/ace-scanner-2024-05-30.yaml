practice_exercises:
- title: Analyze and Improve an ACE Scanner Accessibility Report
  description: 'You have received a digital publication or document package that was
    labeled only as ''Scanned with ACE Scanner.'' Your task is to turn this vague
    scan status into an actionable accessibility review. Create a short accessibility
    analysis report that includes: 1) what ACE Scanner is likely checking for, 2)
    what information is missing from the phrase ''Scanned with ACE Scanner,'' 3) a
    checklist of at least 8 accessibility items you would verify manually or from
    the ACE report, 4) a prioritized remediation plan with high, medium, and low priority
    fixes, and 5) a final recommendation stating whether the content should be accepted,
    revised, or rescanned before release.'
  difficulty: medium
  type: analysis
  hints:
  - 'Hint 1: A scan result is not the same as proof of accessibility; identify what
    evidence is needed.'
  - 'Hint 2: Consider common accessibility areas such as headings, alt text, reading
    order, language metadata, tables, links, and navigation.'
  - 'Hint 3: Prioritize issues that block access for screen reader, keyboard, or low-vision
    users.'
  solution: 'A strong response should explain that ''Scanned with ACE Scanner'' is
    insufficient by itself because it does not include pass/fail results, issue severity,
    file version, scan date, scanner configuration, or remediation evidence. Key checklist
    items should include: presence of document language, valid structure and headings,
    meaningful image alt text, accessible tables with headers, logical reading order,
    descriptive links, accessible navigation/table of contents, sufficient metadata,
    no duplicate or broken IDs, valid EPUB/HTML markup if applicable, keyboard/screen
    reader usability, and review of media alternatives such as captions or transcripts.
    The remediation plan should prioritize blockers first, such as missing navigation,
    broken structure, unreadable images without alt text, invalid markup, or incorrect
    reading order. Medium priorities may include improving link text, table structure,
    and metadata. Low priorities may include consistency improvements or minor warnings.
    The final recommendation should usually be ''rescan and manually review before
    release'' unless a full ACE report and manual validation confirm accessibility.'
