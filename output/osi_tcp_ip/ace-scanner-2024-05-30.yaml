quiz_questions:
- question: What is the most defensible conclusion you can draw from the phrase "Scanned
    with ACE Scanner"?
  answer: A. The document was digitized or processed using a tool called ACE Scanner.
  explanation: The phrase directly indicates that ACE Scanner was involved in scanning
    or processing the document. It does not prove that the scan is accurate, complete,
    error-free, or that the original document was created in that tool. A careful
    interpretation avoids assuming more than the phrase actually states.
  difficulty: easy
  type: multiple_choice
  options:
  - A. The document was digitized or processed using a tool called ACE Scanner.
  - B. The document has been verified as accurate and complete.
  - C. The document was created originally in ACE Scanner rather than scanned.
  - D. The document contains no errors because it was scanned automatically.
- question: 'True or False: The statement "Scanned with ACE Scanner" is sufficient
    evidence that the scanned document preserves the full original content without
    omissions or distortions.'
  answer: 'False'
  explanation: The phrase identifies the scanning tool or process, but it does not
    provide quality assurance details. A scan could still be incomplete, blurry, cropped,
    distorted, or affected by recognition errors. Additional verification would be
    needed to confirm fidelity to the original.
  difficulty: medium
  type: true_false
- question: A researcher receives a digital copy of a legal document that contains
    only the note "Scanned with ACE Scanner." They need to cite the document as evidence
    in a report. What is the best approach?
  answer: B. Use the document but note that it appears to be a scanned copy and seek
    corroboration or access to the original if authenticity matters.
  explanation: The note tells the researcher something about the document's processing
    history, but not enough to establish authenticity or accuracy. The responsible
    approach is to recognize it as a scanned copy and verify it through other means
    when the stakes are high. Automatically trusting or rejecting the document would
    both be overreactions.
  difficulty: medium
  type: scenario
  options:
  - A. Treat the document as fully authenticated because scanner software is named.
  - B. Use the document but note that it appears to be a scanned copy and seek corroboration
    or access to the original if authenticity matters.
  - C. Reject the document automatically because anything scanned is unreliable.
  - D. Assume ACE Scanner performed optical character recognition and that all text
    is accurate.
- question: Compare what the phrase "Scanned with ACE Scanner" tells you with what
    it does not tell you about a document.
  answer: The phrase tells you that the document was scanned or processed using ACE
    Scanner. It does not tell you whether the scan is complete, authentic, legible,
    correctly recognized by OCR, or faithful to the original. Therefore, it is useful
    as processing metadata but not as proof of document reliability.
  explanation: This comparison distinguishes between direct evidence and unsupported
    inference. The phrase provides limited metadata about the tool used, but quality,
    authenticity, and completeness require separate evidence. Understanding this boundary
    is important when evaluating scanned documents critically.
  difficulty: hard
  type: comparison
