quiz_questions:
- question: En el puerto paralelo descrito, las 8 líneas de datos ocupan los pines
    del ___ al ___ inclusive.
  answer: 2 al 9
  explanation: El puerto paralelo transmite un byte completo usando 8 líneas de datos
    independientes. En la descripción se indica que esas líneas corresponden a los
    pines 2 al 9 inclusive; el resto de pines se destinan a señales de control, reconocimiento
    o tierra.
  difficulty: easy
  type: fill_blank
- question: ¿Cuál de las siguientes opciones describe mejor el mecanismo de coordinación
    entre equipos en una comunicación por puerto paralelo?
  answer: B. El emisor coloca un dato en las 8 líneas, activa una señal de strobe,
    y el receptor responde con acknowledge; además puede inhibir la comunicación con
    señales como ocupado o sin papel.
  explanation: En el puerto paralelo, los datos viajan simultáneamente por varias
    líneas, típicamente 8 líneas para formar un byte. La señal de strobe indica que
    el dato ya fue colocado en las líneas, mientras que acknowledge confirma desde
    el otro extremo que fue recibido. Señales como ocupado o sin papel, heredadas
    del uso con impresoras, pueden detener o condicionar la comunicación. Las opciones
    A y C describen rasgos más propios de transmisión serie o de señales serie como
    DTR/DSR, no del mecanismo paralelo explicado.
  difficulty: medium
  type: multiple_choice
  options:
  - A. El emisor envía todos los bits por una sola línea y el receptor reconstruye
    el byte usando una señal de reloj interna.
  - B. El emisor coloca un dato en las 8 líneas, activa una señal de strobe, y el
    receptor responde con acknowledge; además puede inhibir la comunicación con señales
    como ocupado o sin papel.
  - C. El receptor activa DTR para indicar que recibió un byte, y el emisor responde
    con DSR para liberar las líneas de datos.
  - D. Las líneas de tierra se usan alternadamente como datos y control para evitar
    necesitar señales de reconocimiento.
- question: Un técnico quiere conectar directamente dos computadoras antiguas usando
    sus puertos paralelos para transferir datos. Confecciona un cable que une las
    líneas de datos y de control necesarias, pero no instala ningún programa ni protocolo
    de comunicación en los equipos. ¿Qué resultado es más probable?
  answer: C. La conexión física puede ser correcta, pero no habrá comunicación útil
    sin un software asociado que interprete y gestione las señales.
  explanation: El contenido distingue entre el hardware del cableado y la necesidad
    de un software asociado. Aunque se puede confeccionar un cable para conectar directamente
    un puerto paralelo con otro, las señales de datos y control por sí solas no definen
    una transferencia completa de información entre computadoras. Se necesita software
    para decidir cuándo enviar, cómo interpretar los datos, cómo responder a acknowledge,
    ocupado u otras señales, y cómo organizar la comunicación.
  difficulty: medium
  type: scenario
  options:
  - A. La transferencia funcionará automáticamente porque el puerto paralelo ya define
    por hardware todo el intercambio de archivos.
  - B. Solo se podrán enviar datos en un sentido, porque el puerto paralelo nunca
    admite señales de retorno.
  - C. La conexión física puede ser correcta, pero no habrá comunicación útil sin
    un software asociado que interprete y gestione las señales.
  - D. La comunicación funcionará únicamente si se eliminan las señales de control
    y se dejan solo las ocho líneas de datos.
- question: Compara la transmisión paralela y la transmisión serie descritas en el
    material. Explica cómo difieren en la forma de transportar los datos y en el papel
    de las señales de control.
  answer: En la transmisión paralela, varios bits del dato viajan al mismo tiempo
    por líneas separadas, por ejemplo 8 líneas para un byte, junto con señales de
    control como strobe, acknowledge, ocupado o sin papel. En la transmisión serie,
    la información se envía secuencialmente por una línea de transmisión y se recibe
    por otra, acompañada de señales de control como DTR/DSR y líneas de flujo como
    RTS/CTS. En ambos casos las señales de control no transportan el dato principal,
    sino que coordinan cuándo los equipos están listos, cuándo se recibió información
    o cuándo debe detenerse el envío.
  explanation: 'La diferencia central es la organización física y temporal del dato.
    El puerto paralelo usa múltiples líneas para mover varios bits simultáneamente,
    lo que permite separar claramente líneas de datos y líneas de control. La comunicación
    serie reduce el envío de datos a una secuencia por una línea de transmisión y
    otra de recepción, por lo que requiere circuitos o chips que adapten la señalización
    externa a los niveles internos del PC. Sin embargo, ambas formas de comunicación
    necesitan control: no basta con tener una ruta para los bits, también hace falta
    coordinar disponibilidad, reconocimiento y flujo.'
  difficulty: hard
  type: comparison
flashcards:
- front: ¿Qué caracteriza a la transmisión por puerto paralelo?
  back: Utiliza varias líneas de comunicación simultáneas, permitiendo que datos y
    señales de control circulen a la vez y de forma independiente.
  tags:
  - puerto-paralelo
  - definición
- front: ¿Qué pines del puerto paralelo se usan típicamente para transmitir los 8
    bits de datos?
  back: Los pines 2 al 9 se usan como líneas de datos, transportando un byte completo
    en paralelo.
  tags:
  - puerto-paralelo
  - pines
  - datos
- front: ¿Cómo confirma un dispositivo receptor que recibió un dato en una comunicación
    por puerto paralelo?
  back: Mediante la señal ACK o acknowledge, típicamente recibida por el pin 10.
  tags:
  - puerto-paralelo
  - control
  - handshake
- front: ¿En qué se diferencia la transmisión serie de la transmisión paralela?
  back: La transmisión serie envía la información bit a bit por una línea principal
    de transmisión, mientras que la paralela envía varios bits simultáneamente por
    varias líneas.
  tags:
  - puerto-serie
  - puerto-paralelo
  - comparación
- front: ¿Para qué sirven las señales DTR y DSR en una comunicación serie?
  back: DTR indica que el equipo local está listo, y DSR indica que el equipo remoto
    también está listo para la comunicación.
  tags:
  - puerto-serie
  - control
  - handshake
practice_exercises:
- title: Construcción y verificación de un cable serial tipo null-modem DB9
  description: 'Implementa un enlace de comunicación serial entre dos equipos usando
    conectores DB9, simulando la práctica de laboratorio descrita. Tu tarea es diseñar
    el cableado, construir o representar el cable, configurar el software de comunicación
    y verificar que el enlace funcione correctamente. Entregables: 1) tabla de conexión
    pin a pin para un cable null-modem DB9, indicando función de cada pin; 2) esquema
    simple del cableado; 3) configuración elegida del puerto serial, por ejemplo velocidad,
    bits de datos, paridad, bits de parada y control de flujo; 4) procedimiento de
    prueba usando Procomm, PuTTY, Tera Term u otro terminal serial; 5) breve informe
    explicando qué señales transportan datos, cuáles controlan el flujo y qué fallas
    aparecerían si TX/RX, GND o RTS/CTS estuvieran mal conectados. Si no tienes hardware
    real, puedes realizar la actividad con un simulador de puerto serial o describir
    el procedimiento de medición con multímetro.'
  difficulty: medium
  type: implementation
  hints:
  - 'Recuerda que en un cable null-modem las líneas de transmisión y recepción se
    cruzan: TX de un equipo debe llegar a RX del otro.'
  - 'La tierra común es indispensable: sin GND compartido, la comunicación puede ser
    inestable o no funcionar.'
  - Si activas control de flujo por hardware, debes cablear correctamente RTS/CTS
    y/o DTR/DSR; si no, usa control de flujo desactivado para una prueba básica.
  solution: 'Una solución correcta debe incluir, como mínimo, el cruce de datos DB9:
    pin 2 RXD de un conector al pin 3 TXD del otro, pin 3 TXD al pin 2 RXD, y pin
    5 GND al pin 5 GND. Para una versión con control de flujo por hardware, se puede
    cablear pin 7 RTS al pin 8 CTS del otro extremo y pin 8 CTS al pin 7 RTS. También
    puede conectarse pin 4 DTR al pin 6 DSR y opcionalmente al pin 1 DCD del otro
    extremo, repitiendo el cruce en sentido inverso. Una configuración típica funcional
    es 9600 baudios, 8 bits de datos, sin paridad, 1 bit de parada, control de flujo
    ninguno para la primera prueba, o RTS/CTS si se cablearon esas líneas. El procedimiento
    esperado consiste en conectar ambos extremos, abrir un programa terminal en cada
    equipo, seleccionar el puerto COM correcto, aplicar la misma configuración en
    ambos lados y escribir caracteres en una terminal verificando que aparezcan en
    la otra. Las conclusiones deben indicar que TX/RX transportan los datos, GND establece
    la referencia común, RTS/CTS y DTR/DSR sirven para control o disponibilidad del
    equipo, y que errores típicos son: TX/RX sin cruzar produce ausencia de recepción;
    GND desconectado causa comunicación errática; velocidades o formatos distintos
    producen caracteres ilegibles; RTS/CTS mal cableados pueden bloquear la transmisión
    si el control de flujo está activado.'
